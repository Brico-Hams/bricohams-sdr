<svg xmlns='http://www.w3.org/2000/svg' width='1400' height='860' viewBox='0 0 1400 860' font-family='DejaVu Sans, Arial, sans-serif'><rect width='1400' height='860' fill='#ffffff'/><text x='24' y='36' font-size='22' font-weight='bold' fill='#1d2733'>Alimentación dentro de la caja (cargador USB de 45 W)</text><text x='24' y='58' font-size='12' fill='#5f6b78'>BricoHams SDR · EA5KAO · Mi QTH (Región de Murcia) · generado por tools/esquemas.py</text><rect x='0' y='852' width='1400' height='8' fill='#F26B21'/><rect x='0' y='850' width='1400' height='2' fill='#A6192E'/><defs><marker id='ac62828' markerWidth='10' markerHeight='8' refX='9' refY='4' orient='auto'><path d='M0,0 L10,4 L0,8 z' fill='#c62828'/></marker><marker id='a1565c0' markerWidth='10' markerHeight='8' refX='9' refY='4' orient='auto'><path d='M0,0 L10,4 L0,8 z' fill='#1565c0'/></marker><marker id='a00838f' markerWidth='10' markerHeight='8' refX='9' refY='4' orient='auto'><path d='M0,0 L10,4 L0,8 z' fill='#00838f'/></marker><marker id='a2e7d32' markerWidth='10' markerHeight='8' refX='9' refY='4' orient='auto'><path d='M0,0 L10,4 L0,8 z' fill='#2e7d32'/></marker></defs><rect x='24' y='150' width='230' height='120' rx='8' fill='#fdecea' stroke='#c62828' stroke-width='2'/><rect x='24' y='150' width='230' height='24' rx='8' fill='#c62828'/><rect x='24' y='164' width='230' height='10' fill='#c62828'/><text x='34' y='167' font-size='13' font-weight='bold' fill='#fff'>230 V · red</text><text x='34' y='192' font-size='11.5' fill='#1d2733'>manguera H07RN-F 2 × 1 mm²</text><text x='34' y='208' font-size='11.5' fill='#1d2733'>diferencial 30 mA</text><text x='34' y='224' font-size='11.5' fill='#1d2733'>prensaestopas PG9</text><text x='34' y='240' font-size='11.5' fill='#1d2733'>empalme WAGO 221 + anclaje</text><rect x='330' y='130' width='280' height='160' rx='8' fill='#fdecea' stroke='#c62828' stroke-width='2'/><rect x='330' y='130' width='280' height='24' rx='8' fill='#c62828'/><rect x='330' y='144' width='280' height='10' fill='#c62828'/><text x='340' y='147' font-size='13' font-weight='bold' fill='#fff'>Cargador USB 45 W</text><text x='340' y='172' font-size='11.5' fill='#1d2733'>multitoma, clase II, marcado CE</text><text x='340' y='188' font-size='11.5' fill='#1d2733'>USB-C PD: 5 V 3 A (15 W)</text><text x='340' y='204' font-size='11.5' fill='#1d2733'>USB-A: 5 V 2,4 A (12 W)</text><text x='340' y='220' font-size='11.5' fill='#1d2733'>resto de puertos: reserva</text><text x='340' y='236' font-size='11.5' fill='#1d2733'>(compartimento de potencia)</text><line x1='254' y1='210' x2='328' y2='210' stroke='#c62828' stroke-width='2' marker-end='url(#ac62828)'/><text x='295.0' y='206.0' font-size='10.5' fill='#c62828'>230 V</text><rect x='720' y='90' width='300' height='150' rx='8' fill='#edf7ee' stroke='#2e7d32' stroke-width='2'/><rect x='720' y='90' width='300' height='24' rx='8' fill='#2e7d32'/><rect x='720' y='104' width='300' height='10' fill='#2e7d32'/><text x='730' y='107' font-size='13' font-weight='bold' fill='#fff'>Raspberry Pi 5</text><text x='730' y='132' font-size='11.5' fill='#1d2733'>+ HAT: RTL-SDR, SX1262, GPS, RTC</text><text x='730' y='148' font-size='11.5' fill='#1d2733'>+ cámara WPI408 + LED IR (CSI)</text><text x='730' y='164' font-size='11.5' fill='#1d2733'>consumo 8–12 W</text><text x='730' y='180' font-size='11.5' fill='#1d2733'>USB limitado a 0,6 A en total</text><text x='730' y='196' font-size='11.5' fill='#1d2733'>(PI5_USB_MAX_CURRENT="no")</text><line x1='610' y1='170' x2='718' y2='170' stroke='#c62828' stroke-width='2' marker-end='url(#ac62828)'/><text x='668.0' y='166.0' font-size='10.5' fill='#c62828'>USB-C</text><rect x='720' y='330' width='300' height='120' rx='8' fill='#eef4fb' stroke='#1565c0' stroke-width='2'/><rect x='720' y='330' width='300' height='24' rx='8' fill='#1565c0'/><rect x='720' y='344' width='300' height='10' fill='#1565c0'/><text x='730' y='347' font-size='13' font-weight='bold' fill='#fff'>Hub USB 2.0 alimentado</text><text x='730' y='372' font-size='11.5' fill='#1d2733'>«regleta USB energizada»</text><text x='730' y='388' font-size='11.5' fill='#1d2733'>alimentado por el USB-A del cargador</text><text x='730' y='404' font-size='11.5' fill='#1d2733'>consumo de lo que cuelga: ~6 W</text><line x1='610' y1='250' x2='718' y2='380' stroke='#c62828' stroke-width='2' marker-end='url(#ac62828)'/><text x='668.0' y='311.0' font-size='10.5' fill='#c62828'>USB-A 5 V</text><line x1='870' y1='330' x2='870' y2='242' stroke='#1565c0' stroke-width='2' stroke-dasharray='6 4' marker-end='url(#a1565c0)'/><text x='874.0' y='282.0' font-size='10.5' fill='#1565c0'>datos (upstream)</text><rect x='1110' y='90' width='260' height='56' rx='8' fill='#f7f9fb' stroke='#1565c0' stroke-width='2'/><rect x='1110' y='90' width='260' height='24' rx='8' fill='#1565c0'/><rect x='1110' y='104' width='260' height='10' fill='#1565c0'/><text x='1120' y='107' font-size='13' font-weight='bold' fill='#fff'>Mini RTL-SDR</text><text x='1120' y='132' font-size='11.5' fill='#1d2733'>0,3 A</text><line x1='1020' y1='390' x2='1108' y2='118' stroke='#1565c0' stroke-width='2' marker-end='url(#a1565c0)'/><rect x='1110' y='164' width='260' height='56' rx='8' fill='#f7f9fb' stroke='#1565c0' stroke-width='2'/><rect x='1110' y='164' width='260' height='24' rx='8' fill='#1565c0'/><rect x='1110' y='178' width='260' height='10' fill='#1565c0'/><text x='1120' y='181' font-size='13' font-weight='bold' fill='#fff'>RTL-SDR V3</text><text x='1120' y='206' font-size='11.5' fill='#1d2733'>0,3 A</text><line x1='1020' y1='390' x2='1108' y2='192' stroke='#1565c0' stroke-width='2' marker-end='url(#a1565c0)'/><rect x='1110' y='238' width='260' height='56' rx='8' fill='#f7f9fb' stroke='#1565c0' stroke-width='2'/><rect x='1110' y='238' width='260' height='24' rx='8' fill='#1565c0'/><rect x='1110' y='252' width='260' height='10' fill='#1565c0'/><text x='1120' y='255' font-size='13' font-weight='bold' fill='#fff'>FlightStick</text><text x='1120' y='280' font-size='11.5' fill='#1d2733'>0,35 A</text><line x1='1020' y1='390' x2='1108' y2='266' stroke='#1565c0' stroke-width='2' marker-end='url(#a1565c0)'/><rect x='1110' y='312' width='260' height='56' rx='8' fill='#f7f9fb' stroke='#00838f' stroke-width='2'/><rect x='1110' y='312' width='260' height='24' rx='8' fill='#00838f'/><rect x='1110' y='326' width='260' height='10' fill='#00838f'/><text x='1120' y='329' font-size='13' font-weight='bold' fill='#fff'>LilyGO Meshtastic</text><text x='1120' y='354' font-size='11.5' fill='#1d2733'>0,1 A (+TX)</text><line x1='1020' y1='390' x2='1108' y2='340' stroke='#00838f' stroke-width='2' marker-end='url(#a00838f)'/><rect x='1110' y='386' width='260' height='56' rx='8' fill='#f7f9fb' stroke='#00838f' stroke-width='2'/><rect x='1110' y='386' width='260' height='24' rx='8' fill='#00838f'/><rect x='1110' y='400' width='260' height='10' fill='#00838f'/><text x='1120' y='403' font-size='13' font-weight='bold' fill='#fff'>LilyGO iGate</text><text x='1120' y='428' font-size='11.5' fill='#1d2733'>0,1 A</text><line x1='1020' y1='390' x2='1108' y2='414' stroke='#00838f' stroke-width='2' marker-end='url(#a00838f)'/><text x='24' y='540' font-size='15' font-weight='bold' fill='#1d2733'>Presupuesto de potencia</text><text x='24' y='572' font-size='12.5' font-weight='bold' fill='#5f6b78'>Consumidor</text><text x='420' y='572' font-size='12.5' font-weight='bold' fill='#5f6b78'>Puerto</text><text x='640' y='572' font-size='12.5' font-weight='bold' fill='#5f6b78'>Típico</text><text x='820' y='572' font-size='12.5' font-weight='bold' fill='#5f6b78'>Disponible</text><text x='24' y='600' font-size='13' fill='#1d2733'>Raspberry Pi 5 + HAT + cámara</text><text x='420' y='600' font-size='13' fill='#1d2733'>USB-C PD</text><text x='640' y='600' font-size='13' fill='#1d2733'>8–12 W</text><text x='820' y='600' font-size='13' fill='#1d2733'>15 W</text><text x='24' y='624' font-size='13' fill='#1d2733'>3 RTL-SDR + 2 LilyGO (hub)</text><text x='420' y='624' font-size='13' fill='#1d2733'>USB-A</text><text x='640' y='624' font-size='13' fill='#1d2733'>5–7 W</text><text x='820' y='624' font-size='13' fill='#1d2733'>12 W</text><text x='24' y='648' font-size='13' fill='#1d2733' font-weight='bold'>Total</text><text x='420' y='648' font-size='13' fill='#1d2733' font-weight='bold'></text><text x='640' y='648' font-size='13' fill='#1d2733' font-weight='bold'>13–19 W</text><text x='820' y='648' font-size='13' fill='#1d2733' font-weight='bold'>45 W (≈ 40 %)</text><text x='24' y='700' font-size='12.5' fill='#1d2733'>La Pi 5 solo negocia 5 A con la fuente oficial: con el cargador de 45 W arranca a 5 V 3 A y limita sus USB a 0,6 A.</text><text x='24' y='722' font-size='12.5' fill='#1d2733'>Por eso los SDR y los LilyGO van al hub alimentado; a la Pi solo llegan sus datos. El RTL del HAT se alimenta de la propia Pi.</text><text x='24' y='744' font-size='12.5' fill='#1d2733'>Cable USB-C de 3 A y lo más corto posible: si bricohams-check avisa de get_throttled ≠ 0x0, revisa cable y puerto.</text><text x='24' y='766' font-size='12.5' fill='#1d2733'>El SDRplay futuro irá al USB 3.0 de la Pi (0,2 A, cabe en el límite de 0,6 A).</text></svg>