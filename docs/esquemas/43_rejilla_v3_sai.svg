ba (N): el fusible ATO de 15 A debe quedar a ≤ 10 cm del borne positivo.</text><text x='30' y='648.0' font-size='10.5' fill='#23272B' text-anchor='start'>Entradas de 230 V por los PG9 de la cara inferior; ventilas de entrada (abajo) y salida (arriba) siempre despejadas por el hidrógeno.</text><text x='30' y='665.0' font-size='10.5' fill='#23272B' text-anchor='start'>Fuente: hardware/caja_v3/caja_v3.scad · manual 17 · manual 52, capítulo 6 bis.</text></svg>