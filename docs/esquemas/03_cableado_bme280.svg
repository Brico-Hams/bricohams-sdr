<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='640' viewBox='0 0 1200 640' font-family='DejaVu Sans, Arial, sans-serif'><rect width='1200' height='640' fill='#ffffff'/><text x='24' y='36' font-size='22' font-weight='bold' fill='#1d2733'>Cableado del sensor BME280/BMP280 (I2C-1)</text><text x='24' y='58' font-size='12' fill='#5f6b78'>BricoHams SDR · EA5KAO · Mi QTH (Región de Murcia) · generado por tools/esquemas.py</text><rect x='0' y='632' width='1200' height='8' fill='#F26B21'/><rect x='0' y='630' width='1200' height='2' fill='#A6192E'/><defs><marker id='a9aa6b2' markerWidth='10' markerHeight='8' refX='9' refY='4' orient='auto'><path d='M0,0 L10,4 L0,8 z' fill='#9aa6b2'/></marker></defs><rect x='80' y='130' width='240' height='300' rx='10' fill='#6a1b9a'/><text x='200' y='160' font-size='15' text-anchor='middle' fill='#fff' font-weight='bold'>GY-BME/BMP280 (GYBMEP)</text><text x='200' y='180' font-size='10.5' text-anchor='middle' fill='#e1bee7'>regulador 662K 3,3 V</text><text x='200' y='196' font-size='10.5' text-anchor='middle' fill='#e1bee7'>+ adaptación de nivel I2C</text><rect x='170' y='330' width='60' height='60' rx='6' fill='#cfd8dc'/><text x='200' y='366' font-size='10' text-anchor='middle' fill='#37474f'>sensor</text><circle cx='300' cy='220' r='7' fill='#ffd54f' stroke='#5d4037'/><text x='286' y='224' font-size='12' text-anchor='end' fill='#fff' font-weight='bold'>VIN</text><path d='M307,220 C520,220 620,220 840,220' stroke='#d32f2f' stroke-width='4' fill='none'/><text x='560' y='215' font-size='11' text-anchor='middle' fill='#1d2733'>rojo</text><rect x='840' y='209' width='22' height='22' rx='3' fill='#c62828'/><text x='872' y='224' font-size='12.5' fill='#1d2733' font-weight='bold'>pin 1 · 3V3</text><circle cx='300' cy='246' r='7' fill='#ffd54f' stroke='#5d4037'/><text x='286' y='250' font-size='12' text-anchor='end' fill='#fff' font-weight='bold'>GND</text><path d='M307,246 C520,246 620,246 840,246' stroke='#212121' stroke-width='4' fill='none'/><text x='560' y='241' font-size='11' text-anchor='middle' fill='#1d2733'>negro</text><rect x='840' y='235' width='22' height='22' rx='3' fill='#37474f'/><text x='872' y='250' font-size='12.5' fill='#1d2733' font-weight='bold'>pin 9 · GND</text><circle cx='300' cy='272' r='7' fill='#ffd54f' stroke='#5d4037'/><text x='286' y='276' font-size='12' text-anchor='end' fill='#fff' font-weight='bold'>SCL</text><path d='M307,272 C520,272 620,272 840,272' stroke='#fbc02d' stroke-width='4' fill='none'/><text x='560' y='267' font-size='11' text-anchor='middle' fill='#1d2733'>amarillo</text><rect x='840' y='261' width='22' height='22' rx='3' fill='#2e7d32'/><text x='872' y='276' font-size='12.5' fill='#1d2733' font-weight='bold'>pin 5 · GPIO3 SCL1</text><circle cx='300' cy='298' r='7' fill='#ffd54f' stroke='#5d4037'/><text x='286' y='302' font-size='12' text-anchor='end' fill='#fff' font-weight='bold'>SDA</text><path d='M307,298 C520,298 620,298 840,298' stroke='#1976d2' stroke-width='4' fill='none'/><text x='560' y='293' font-size='11' text-anchor='middle' fill='#1d2733'>azul</text><rect x='840' y='287' width='22' height='22' rx='3' fill='#2e7d32'/><text x='872' y='302' font-size='12.5' fill='#1d2733' font-weight='bold'>pin 3 · GPIO2 SDA1</text><text x='840' y='190' font-size='13' fill='#2e7d32' font-weight='bold'>Raspberry Pi 5 (o pines pasantes del HAT)</text><text x='80' y='480' font-size='12.5' fill='#1d2733'>• Alimentar a 3,3 V (pin 1): el bus I2C de la Pi es de 3,3 V.</text><text x='80' y='500' font-size='12.5' fill='#1d2733'>• Dirección 0x76 (SDO a GND, lo normal en GYBMEP) o 0x77: el software prueba las dos.</text><text x='80' y='520' font-size='12.5' fill='#1d2733'>• El chip se reconoce solo: ID 0x60 = BME280 (con humedad), 0x58 = BMP280 (sin humedad).</text><text x='80' y='540' font-size='12.5' fill='#1d2733'>• Comparte el bus con el RTC del HAT (0x51): no hay conflicto de direcciones.</text><text x='80' y='560' font-size='12.5' fill='#1d2733'>• Cable apantallado de 4 hilos, máx. ~2 m a 100 kHz. Más largo: extensor I2C (P82B715) o el sensor junto a la caja.</text><text x='80' y='580' font-size='12.5' fill='#1d2733'>• Garita de radiación ventilada a la sombra, 1,5-2 m del suelo y lejos de la caja de la Pi (que calienta).</text><text x='80' y='600' font-size='12.5' fill='#1d2733'>• Comprobar: sudo i2cdetect -y 1 → 51 (RTC) y 76/77 (sensor) · sudo bricohams-wx --una</text></svg>