<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" role="img" aria-labelledby="title desc">
  <title id="title">ADS-B: un receptor y dos destinos simultaneos</title>
  <desc id="desc">readsb recibe del SDR y comparte Beast con RadarBox y map.flights, manteniendo el mapa local. El cliente MLAT de map.flights usa el mismo UUID privado, sin reinyectar resultados en readsb.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6" fill="#334155"/></marker></defs>
  <rect width="1000" height="550" rx="18" fill="#f8fafc"/>
  <g font-family="sans-serif" fill="#0f172a">
    <text x="30" y="42" font-size="25" font-weight="bold">ADS-B local + RadarBox + map.flights</text>
    <text x="30" y="73" font-size="16">Ilustracion funcional. No contiene UUID, claves ni datos de una estacion real.</text>
    <g stroke="#0369a1" fill="#e0f2fe" stroke-width="2">
      <rect x="30" y="145" width="175" height="95" rx="12"/>
      <rect x="270" y="145" width="190" height="95" rx="12"/>
      <rect x="560" y="110" width="400" height="80" rx="12"/>
      <rect x="560" y="225" width="400" height="80" rx="12"/>
      <rect x="560" y="345" width="400" height="80" rx="12"/>
      <rect x="270" y="345" width="190" height="80" rx="12"/>
    </g>
    <g font-size="18" text-anchor="middle">
      <text x="117" y="183">SDR dedicado</text><text x="117" y="212">1090 MHz</text>
      <text x="365" y="183">readsb</text><text x="365" y="212">Decodificador</text>
      <text x="760" y="140">rbfeeder / RadarBox</text><text x="760" y="168">Se conserva su configuracion</text>
      <text x="760" y="255">feed.map.flights:30004</text><text x="760" y="283">Beast etiquetado con UUID privado</text>
      <text x="760" y="375">mlat.map.flights:31090</text><text x="760" y="403">Cliente MLAT separado; mismo UUID</text>
      <text x="365" y="375">Mapa local</text><text x="365" y="403">Datos + fichas</text>
    </g>
    <g stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
      <path d="M205 192 H270"/>
      <path d="M460 175 H510 V150 H560"/>
      <path d="M460 200 H510 V265 H560"/>
      <path d="M420 240 V320 H520 V385 H560"/>
      <path d="M365 240 V345"/>
    </g>
    <text x="432" y="315" font-size="15">Beast local :30005</text>
    <text x="30" y="470" font-size="18" font-weight="bold">Verificar por separado:</text>
    <text x="30" y="500" font-size="17">recepcion local, llegada a ambos portales y handshake MLAT.</text>
    <text x="30" y="528" font-size="16">No usar la clave mf_feed_ como etiqueta UUID. MLAT map.flights sin reinyeccion.</text>
  </g>
</svg>
