<svg xmlns='http://www.w3.org/2000/svg' width='1500' height='1000' viewBox='0 0 1500 1000' font-family='DejaVu Sans, Arial, sans-serif'><rect width='1500' height='1000' fill='#ffffff'/><text x='24' y='36' font-size='22' font-weight='bold' fill='#1d2733'>Puente USB «bricohams-io»: sensores y ventiladores en una Raspberry Pi Pico</text><text x='24' y='58' font-size='12' fill='#5f6b78'>BricoHams SDR · EA5KAO · Mi QTH (Región de Murcia) · generado por tools/esquemas.py</text><rect x='0' y='992' width='1500' height='8' fill='#F26B21'/><rect x='0' y='990' width='1500' height='2' fill='#A6192E'/><defs><marker id='ac62828' markerWidth='10' markerHeight='8' refX='9' refY='4' orient='auto'><path d='M0,0 L10,4 L0,8 z' fill='#c62828'/></marker></defs><rect x='40' y='90' width='260' height='120' rx='6' fill='#edf7ee' stroke='#2e7d32' stroke-width='1.8'/><text x='170.0' y='146.0' font-size='11.5' fill='#2e7d32' font-weight="bold" text-anchor='middle'>Raspberry Pi 5 + HAT</text><text x='170.0' y='161.0' font-size='9.5' fill='#5f6b78' text-anchor='middle'>la cabecera de 40 pines la usa el HAT</text><rect x='40' y='260' width='260' height='80' rx='6' fill='#eef4fb' stroke='#1565c0' stroke-width='1.8'/><text x='170.0' y='296.0' font-size='11.5' fill='#1565c0' font-weight="bold" text-anchor='middle'>Regleta USB Vansuny</text><text x='170.0' y='311.0' font-size='9.5' fill='#5f6b78' text-anchor='middle'>alimentada por el bus de 12 V</text><line x1='170' y1='210' x2='170' y2='260' stroke='#1565c0' stroke-width='3'/><text x='180' y='240' font-size='10' fill='#1565c0' text-anchor='start'>USB 3.0 (datos)</text><rect x='420' y='160' width='300' height='560' rx='6' fill='#fff3e0' stroke='#F26B21' stroke-width='1.8'/><text x='570.0' y='180' font-size='11.5' fill='#F26B21' font-weight="bold" text-anchor='middle'>Raspberry Pi Pico «bricohams-io»</text><text x='570.0' y='196' font-size='9.5' fill='#5f6b78' text-anchor='middle'>MicroPython · /dev/bricohams-io (2e8a:0005)</text><line x1='300' y1='300' x2='420' y2='300' stroke='#1565c0' stroke-width='3'/><text x='310' y='292' font-size='10' fill='#1565c0' text-anchor='start'>cable micro-USB (datos + 5 V)</text><text x='710' y='240' font-size='10.5' fill='#2e7d32' text-anchor='end'>GP4 · pin 6 · SDA (I2C0)</text><line x1='720' y1='236' x2='780' y2='236' stroke='#2e7d32' stroke-width='1.6'/><text x='710' y='270' font-size='10.5' fill='#2e7d32' text-anchor='end'>GP5 · pin 7 · SCL (I2C0)</text><line x1='720' y1='266' x2='780' y2='266' stroke='#2e7d32' stroke-width='1.6'/><text x='710' y='330' font-size='10.5' fill='#2e7d32' text-anchor='end'>GP22 · pin 29 · 1-Wire</text><line x1='720' y1='326' x2='780' y2='326' stroke='#2e7d32' stroke-width='1.6'/><text x='710' y='390' font-size='10.5' fill='#00695c' text-anchor='end'>GP15 · pin 20 · pluviómetro</text><line x1='720' y1='386' x2='780' y2='386' stroke='#00695c' stroke-width='1.6'/><text x='710' y='460' font-size='10.5' fill='#6a1b9a' text-anchor='end'>GP16 · pin 21 · PWM ventilador 1</text><line x1='720' y1='456' x2='780' y2='456' stroke='#6a1b9a' stroke-width='1.6'/><text x='710' y='490' font-size='10.5' fill='#6a1b9a' text-anchor='end'>GP17 · pin 22 · PWM ventilador 2</text><line x1='720' y1='486' x2='780' y2='486' stroke='#6a1b9a' stroke-width='1.6'/><text x='710' y='550' font-size='10.5' fill='#ef6c00' text-anchor='end'>GP18 · pin 24 · TACH 1</text><line x1='720' y1='546' x2='780' y2='546' stroke='#ef6c00' stroke-width='1.6'/><text x='710' y='580' font-size='10.5' fill='#ef6c00' text-anchor='end'>GP19 · pin 25 · TACH 2</text><line x1='720' y1='576' x2='780' y2='576' stroke='#ef6c00' stroke-width='1.6'/><text x='710' y='640' font-size='10.5' fill='#c62828' text-anchor='end'>3V3(OUT) · pin 36</text><line x1='720' y1='636' x2='780' y2='636' stroke='#c62828' stroke-width='1.6'/><text x='710' y='670' font-size='10.5' fill='#37474f' text-anchor='end'>GND · pin 38 (y 3, 8, 13…)</text><line x1='720' y1='666' x2='780' y2='666' stroke='#37474f' stroke-width='1.6'/><text x='786' y='640' font-size='9.5' fill='#c62828' text-anchor='start'>→ VIN del BME280, VDD del DS18B20 y pull-ups</text><text x='786' y='670' font-size='9.5' fill='#37474f' text-anchor='start'>→ masa común (sensores, MOSFET y bus de 12 V)</text><rect x='860' y='200' width='270' height='90' rx='6' fill='#edf7ee' stroke='#2e7d32' stroke-width='1.8'/><text x='995.0' y='241.0' font-size='11.5' fill='#2e7d32' font-weight="bold" text-anchor='middle'>BME280 / BMP280 (garita)</text><text x='995.0' y='256.0' font-size='9.5' fill='#5f6b78' text-anchor='middle'>VIN 3V3 · GND · SDA · SCL · cable ≤ 5 m</text><line x1='780' y1='236' x2='860' y2='236' stroke='#2e7d32' stroke-width='1.6'/><line x1='780' y1='266' x2='860' y2='266' stroke='#2e7d32' stroke-width='1.6'/><rect x='860' y='310' width='270' height='70' rx='6' fill='#edf7ee' stroke='#2e7d32' stroke-width='1.8'/><text x='995.0' y='341.0' font-size='11.5' fill='#2e7d32' font-weight="bold" text-anchor='middle'>DS18B20 (aire de la caja)</text><text x='995.0' y='356.0' font-size='9.5' fill='#5f6b78' text-anchor='middle'>DQ · 4,7 kΩ entre DQ y 3V3</text><line x1='780' y1='326' x2='860' y2='340' stroke='#2e7d32' stroke-width='1.6'/><rect x='860' y='395' width='270' height='70' rx='6' fill='#e0f2f1' stroke='#00695c' stroke-width='1.8'/><text x='995.0' y='426.0' font-size='11.5' fill='#00695c' font-weight="bold" text-anchor='middle'>Pluviómetro (reed)</text><text x='995.0' y='441.0' font-size='9.5' fill='#5f6b78' text-anchor='middle'>10 kΩ a 3V3 + 100 nF a GND · otro hilo a GND</text><line x1='780' y1='386' x2='860' y2='425' stroke='#00695c' stroke-width='1.6'/><rect x='860' y='470' width='230' height='110' rx='6' fill='#f7f9fb' stroke='#6a1b9a' stroke-width='1.8'/><text x='975.0' y='521.0' font-size='11.5' fill='#6a1b9a' font-weight="bold" text-anchor='middle'>Q1 · 2N7002 (o BSS138)</text><text x='975.0' y='536.0' font-size='9.5' fill='#5f6b78' text-anchor='middle'>G ← 1 kΩ ← GP16 · 100 kΩ G–S · S a GND</text><line x1='780' y1='456' x2='860' y2='510' stroke='#6a1b9a' stroke-width='1.5'/><rect x='1180' y='470' width='280' height='110' rx='6' fill='#eef4fb' stroke='#1565c0' stroke-width='1.8'/><text x='1320.0' y='521.0' font-size='11.5' fill='#1565c0' font-weight="bold" text-anchor='middle'>Ventilador 1 · 60 mm 12 V PWM</text><text x='1320.0' y='536.0' font-size='9.5' fill='#5f6b78' text-anchor='middle'>ENTRADA (abajo izq.)</text><line x1='1090' y1='525' x2='1180' y2='525' stroke='#6a1b9a' stroke-width='1.8'/><text x='1135' y='518' font-size='9.5' fill='#6a1b9a' text-anchor='middle'>D → PWM azul</text><rect x='860' y='620' width='230' height='110' rx='6' fill='#f7f9fb' stroke='#6a1b9a' stroke-width='1.8'/><text x='975.0' y='671.0' font-size='11.5' fill='#6a1b9a' font-weight="bold" text-anchor='middle'>Q2 · 2N7002 (o BSS138)</text><text x='975.0' y='686.0' font-size='9.5' fill='#5f6b78' text-anchor='middle'>G ← 1 kΩ ← GP17 · 100 kΩ G–S · S a GND</text><line x1='780' y1='486' x2='860' y2='660' stroke='#6a1b9a' stroke-width='1.5'/><rect x='1180' y='620' width='280' height='110' rx='6' fill='#eef4fb' stroke='#1565c0' stroke-width='1.8'/><text x='1320.0' y='671.0' font-size='11.5' fill='#1565c0' font-weight="bold" text-anchor='middle'>Ventilador 2 · 60 mm 12 V PWM</text><text x='1320.0' y='686.0' font-size='9.5' fill='#5f6b78' text-anchor='middle'>SALIDA (arriba dcha.)</text><line x1='1090' y1='675' x2='1180' y2='675' stroke='#6a1b9a' stroke-width='1.8'/><text x='1135' y='668' font-size='9.5' fill='#6a1b9a' text-anchor='middle'>D → PWM azul</text><line x1='780' y1='546' x2='840' y2='546' stroke='#ef6c00' stroke-width='1.5' stroke-dasharray='6 4'/><line x1='840' y1='546' x2='840' y2='600' stroke='#ef6c00' stroke-width='1.5' stroke-dasharray='6 4'/><line x1='840' y1='600' x2='1470' y2='600' stroke='#ef6c00' stroke-width='1.5' stroke-dasharray='6 4'/><line x1='1470' y1='600' x2='1470' y2='560' stroke='#ef6c00' stroke-width='1.5' stroke-dasharray='6 4'/><line x1='780' y1='576' x2='820' y2='576' stroke='#ef6c00' stroke-width='1.5' stroke-dasharray='6 4'/><line x1='820' y1='576' x2='820' y2='750' stroke='#ef6c00' stroke-width='1.5' stroke-dasharray='6 4'/><line x1='820' y1='750' x2='1470' y2='750' stroke='#ef6c00' stroke-width='1.5' stroke-dasharray='6 4'/><line x1='1470' y1='750' x2='1470' y2='710' stroke='#ef6c00' stroke-width='1.5' stroke-dasharray='6 4'/><text x='1140' y='616' font-size='9.5' fill='#ef6c00' text-anchor='middle'>TACH verde → GP18 · 10 kΩ a 3V3 + 1 kΩ en serie</text><text x='1140' y='766' font-size='9.5' fill='#ef6c00' text-anchor='middle'>TACH verde → GP19 · igual</text><rect x='1180' y='790' width='280' height='70' rx='6' fill='#fdecea' stroke='#c62828' stroke-width='1.8'/><text x='1320.0' y='821.0' font-size='11.5' fill='#c62828' font-weight="bold" text-anchor='middle'>Bus 12 V (WAGO) · fusible 1 A</text><text x='1320.0' y='836.0' font-size='9.5' fill='#5f6b78' text-anchor='middle'>+12 V amarillo a los dos ventiladores</text><text x='40' y='890' font-size='11.2' fill='#1d2733' text-anchor='start'>• El GND del bus de 12 V, el de la Pico y el de los ventiladores tienen que estar unidos (masa común en el WAGO de masa).</text><text x='40' y='914' font-size='11.2' fill='#1d2733' text-anchor='start'>• La Pico NO admite 5 V en sus pines: tacómetro y PWM siempre con las resistencias / el MOSFET del esquema.</text><text x='40' y='938' font-size='11.2' fill='#1d2733' text-anchor='start'>• Firmware: firmware/pico-io/main.py (MicroPython). Grabar: BOOTSEL + UF2 de MicroPython, después «sudo bricohams-io instalar».</text><text x='40' y='962' font-size='11.2' fill='#1d2733' text-anchor='start'>• Seguridad: si la Pi deja de mandar órdenes 60 s, la Pico pone los ventiladores al 100 % ella sola.</text></svg>