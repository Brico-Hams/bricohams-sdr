roke='#9aa6b2' stroke-width='1.5'/><text x='1010' y='561' font-size='12.5' fill='#1d2733'>hora para MLAT, FT8 y logs</text><line x1='306' y1='556' x2='328' y2='556' stroke='#ef6c00' stroke-width='2' marker-end='url(#aef6c00)'/><line x1='612' y1='556' x2='638' y2='556' stroke='#ef6c00' stroke-width='2' marker-end='url(#aef6c00)'/><rect x='24' y='602' width='280' height='48' rx='6' fill='#fff' stroke='#00838f' stroke-width='1.5'/><text x='34' y='631' font-size='12.5' fill='#1d2733'>433 MHz</text><rect x='330' y='602' width='280' height='48' rx='6' fill='#fff' stroke='#9aa6b2' stroke-width='1.5'/><text x='340' y='631' font-size='12.5' fill='#1d2733'>—</text><rect x='640' y='602' width='280' height='48' rx='6' fill='#eef4fb' stroke='#1565c0' stroke-width='1.5'/><text x='650' y='631' font-size='12.5' fill='#1d2733'>LilyGO 1 · Meshtastic EU_433</text><rect x='1000' y='602' width='370' height='48' rx='6' fill='#fff' stroke='#9aa6b2' stroke-width='1.5'/><text x='1010' y='631' font-size='12.5' fill='#1d2733'>transmite: separar ≥1 m de las RX</text><line x1='306' y1='626' x2='328' y2='626' stroke='#00838f' stroke-width='2' marker-end='url(#a00838f)'/><line x1='612' y1='626' x2='638' y2='626' stroke='#00838f' stroke-width='2' marker-end='url(#a00838f)'/><rect x='24' y='672' width='280' height='48' rx='6' fill='#fff' stroke='#00838f' stroke-width='1.5'/><text x='34' y='701' font-size='12.5' fill='#1d2733'>433 MHz</text><rect x='330' y='672' width='280' height='48' rx='6' fill='#fff' stroke='#9aa6b2' stroke-width='1.5'/><text x='340' y='701' font-size='12.5' fill='#1d2733'>—</text><rect x='640' y='672' width='280' height='48' rx='6' fill='#eef4fb' stroke='#1565c0' stroke-width='1.5'/><text x='650' y='701' font-size='12.5' fill='#1d2733'>LilyGO 2 · iGate LoRa APRS</text><rect x='1000' y='672' width='370' height='48' rx='6' fill='#fff' stroke='#9aa6b2' stroke-width='1.5'/><text x='1010' y='701' font-size='12.5' fill='#1d2733'>solo recepción 433,775 MHz</text><line x1='306' y1='696' x2='328' y2='696' stroke='#00838f' stroke-width='2' marker-end='url(#a00838f)'/><line x1='612' y1='696' x2='638' y2='696' stroke='#00838f' stroke-width='2' marker-end='url(#a00838f)'/><text x='24' y='760' font-size='13' font-weight='bold' fill='#c62828'>Alimentación y USB</text><text x='24' y='784' font-size='12' fill='#1d2733'>En la caja: cargador USB de 45 W. USB-C PD (5 V 3 A) a la Pi 5; USB-A al hub alimentado (esquema 06).</text><text x='24' y='804' font-size='12' fill='#1d2733'>Mini, V3, FlightStick y los 2 LilyGO cuelgan del HUB USB 2.0 ALIMENTADO; a la Pi solo llegan sus datos.</text><text x='24' y='824' font-size='12' fill='#1d2733'>Cámara WPI408 por CSI con cable 15→22 pines de la Pi 5 (máx. ~1 m dentro de la caja). Los LED IR toman 3,3 V de la placa de la cámara.</text><text x='24' y='844' font-size='12' fill='#1d2733'>El módulo LX-LBU2C (power bank 18650, 5 V 2,4 A) NO sirve para la Pi 5: ver docs/EVALUACION_MODULOS.md.</text></svg>