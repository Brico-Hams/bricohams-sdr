<svg xmlns='http://www.w3.org/2000/svg' width='1500' height='900' viewBox='0 0 1500 900' font-family='DejaVu Sans, Arial, sans-serif'><rect width='1500' height='900' fill='#ffffff'/><text x='24' y='36' font-size='22' font-weight='bold' fill='#1d2733'>Clonar OpenWebRX+ a otro equipo: owrx-clone (v4.2)</text><text x='24' y='58' font-size='12' fill='#5f6b78'>BricoHams SDR · generado por tools/esquemas.py</text><rect x='0' y='892' width='1500' height='8' fill='#F26B21'/><rect x='0' y='890' width='1500' height='2' fill='#A6192E'/><defs><marker id='a00695c' markerWidth='10' markerHeight='8' refX='9' refY='4' orient='auto'><path d='M0,0 L10,4 L0,8 z' fill='#00695c'/></marker><marker id='a1565c0' markerWidth='10' markerHeight='8' refX='9' refY='4' orient='auto'><path d='M0,0 L10,4 L0,8 z' fill='#1565c0'/></marker><marker id='a1d2733' markerWidth='10' markerHeight='8' refX='9' refY='4' orient='auto'><path d='M0,0 L10,4 L0,8 z' fill='#1d2733'/></marker><marker id='a2e7d32' markerWidth='10' markerHeight='8' refX='9' refY='4' orient='auto'><path d='M0,0 L10,4 L0,8 z' fill='#2e7d32'/></marker><marker id='aA6192E' markerWidth='10' markerHeight='8' refX='9' refY='4' orient='auto'><path d='M0,0 L10,4 L0,8 z' fill='#A6192E'/></marker><marker id='aF26B21' markerWidth='10' markerHeight='8' refX='9' refY='4' orient='auto'><path d='M0,0 L10,4 L0,8 z' fill='#F26B21'/></marker></defs><rect x='30' y='90' width='420' height='360' rx='6' fill='#edf7ee' stroke='#2e7d32' stroke-width='1.8'/><text x='240.0' y='110' font-size='11.5' fill='#2e7d32' font-weight="bold" text-anchor='middle'>Equipo de ORIGEN</text><text x='240.0' y='126' font-size='9.5' fill='#5f6b78' text-anchor='middle'>sudo owrx-clone exportar [--cifrar] [--publico]</text><text x='50' y='165' font-size='12' fill='#2e7d32' font-weight="bold" text-anchor='start'>config</text><text x='140' y='165' font-size='10.5' fill='#1d2733' text-anchor='start'>/var/lib/openwebrx: settings, users, bookmarks, imágenes</text><text x='50' y='201' font-size='12' fill='#2e7d32' font-weight="bold" text-anchor='start'>etc</text><text x='140' y='201' font-size='10.5' fill='#1d2733' text-anchor='start'>/etc/openwebrx entero</text><text x='50' y='237' font-size='12' fill='#2e7d32' font-weight="bold" text-anchor='start'>web</text><text x='140' y='237' font-size='10.5' fill='#1d2733' text-anchor='start'>htdocs: plugins e init.js añadidos</text><text x='50' y='273' font-size='12' fill='#2e7d32' font-weight="bold" text-anchor='start'>paquetes</text><text x='140' y='273' font-size='10.5' fill='#1d2733' text-anchor='start'>SDR y decodificadores instalados a mano</text><text x='50' y='309' font-size='12' fill='#A6192E' font-weight="bold" text-anchor='start'>sistema</text><text x='140' y='309' font-size='10.5' fill='#1d2733' text-anchor='start'>udev, modprobe rtl/dvb, systemd, codecserver</text><text x='50' y='345' font-size='12' fill='#A6192E' font-weight="bold" text-anchor='start'>parches</text><text x='140' y='345' font-size='10.5' fill='#1d2733' text-anchor='start'>ficheros del paquete retocados (md5)</text><text x='50' y='381' font-size='12' fill='#A6192E' font-weight="bold" text-anchor='start'>extra</text><text x='140' y='381' font-size='10.5' fill='#1d2733' text-anchor='start'>--incluir RUTA</text><text x='50' y='430' font-size='9.8' fill='#5f6b78' text-anchor='start'>verde: se importan por defecto · rojo: solo pidiéndolos (código como root)</text><line x1='450' y1='270' x2='560' y2='270' stroke='#1d2733' stroke-width='2' marker-end='url(#a1d2733)'/><text x='509.0' y='266.0' font-size='10.5' fill='#1d2733'>perfil</text><rect x='560' y='160' width='380' height='230' rx='6' fill='#fff3e0' stroke='#F26B21' stroke-width='1.8'/><text x='750.0' y='180' font-size='11.5' fill='#F26B21' font-weight="bold" text-anchor='middle'>perfil .owrx.tar.gz(.enc)</text><text x='580' y='215' font-size='11' fill='#1d2733' text-anchor='start'>manifiesto.json: origen, niveles, receptores,</text><text x='580' y='241' font-size='11' fill='#1d2733' text-anchor='start'>paquetes y SHA-256 de cada fichero</text><text x='580' y='267' font-size='11' fill='#1d2733' text-anchor='start'>LEEME.txt</text><text x='580' y='293' font-size='11' fill='#1d2733' text-anchor='start'>archivos/&lt;nivel&gt;/… ({DATA}, {HTDOCS})</text><text x='580' y='319' font-size='11' fill='#1d2733' text-anchor='start'>cifrado opcional: AES-256 + PBKDF2</text><text x='580' y='345' font-size='11' fill='#1d2733' text-anchor='start'>--publico: sin users.json ni claves</text><line x1='940' y1='270' x2='1050' y2='270' stroke='#1d2733' stroke-width='2' marker-end='url(#a1d2733)'/><text x='999.0' y='266.0' font-size='10.5' fill='#1d2733'>copiar</text><rect x='1050' y='90' width='420' height='520' rx='6' fill='#eef4fb' stroke='#1565c0' stroke-width='1.8'/><text x='1260.0' y='110' font-size='11.5' fill='#1565c0' font-weight="bold" text-anchor='middle'>Equipo de DESTINO</text><text x='1260.0' y='126' font-size='9.5' fill='#5f6b78' text-anchor='middle'>sudo owrx-clone importar perfil [--simular] [--todo]</text><text x='1070' y='160' font-size='11' fill='#1d2733' text-anchor='start'>1 comprueba SHA-256 y rutas (nada fuera de su sitio)</text><text x='1070' y='190' font-size='11' fill='#1d2733' text-anchor='start'>2 repositorio luarvique de ESTE sistema</text><text x='1070' y='220' font-size='11' fill='#1d2733' text-anchor='start'>(bookworm · trixie · noble · jammy · bullseye)</text><text x='1070' y='250' font-size='11' fill='#1d2733' text-anchor='start'>3 apt install de los paquetes del perfil</text><text x='1070' y='280' font-size='11' fill='#1d2733' text-anchor='start'>4 COPIA de lo que se sobrescribe</text><text x='1070' y='310' font-size='11' fill='#1d2733' text-anchor='start'>→ /var/backups/owrx-clone/copia-FECHA</text><text x='1070' y='340' font-size='11' fill='#1d2733' text-anchor='start'>5 para OpenWebRX+ y copia los ficheros</text><text x='1070' y='370' font-size='11' fill='#1d2733' text-anchor='start'>(modo y dueño: users.json 600, openwebrx)</text><text x='1070' y='400' font-size='11' fill='#1d2733' text-anchor='start'>6 --mapear serial=VIEJO=&gt;serial=NUEVO</text><text x='1070' y='430' font-size='11' fill='#1d2733' text-anchor='start'>7 arranca y espera /status.json</text><text x='1070' y='460' font-size='11' fill='#1d2733' text-anchor='start'>8 avisa de los SDR que no ve conectados</text><rect x='1050' y='640' width='420' height='90' rx='6' fill='#fdecee' stroke='#A6192E' stroke-width='1.8'/><text x='1260.0' y='681.0' font-size='11.5' fill='#A6192E' font-weight="bold" text-anchor='middle'>sudo owrx-clone deshacer</text><text x='1260.0' y='696.0' font-size='9.5' fill='#5f6b78' text-anchor='middle'>devuelve lo sobrescrito y borra lo creado</text><line x1='1260' y1='610' x2='1260' y2='640' stroke='#A6192E' stroke-width='2' marker-end='url(#aA6192E)'/><rect x='30' y='500' width='940' height='230' rx='6' fill='#fafafa' stroke='#1d2733' stroke-width='1.8'/><text x='500.0' y='520' font-size='11.5' fill='#1d2733' font-weight="bold" text-anchor='middle'>Dentro del kit BricoHams</text><text x='50' y='555' font-size='11' fill='#1d2733' text-anchor='start'>• sudo bash install.sh --exportar [fichero]    (no necesita bricohams.env)</text><text x='50' y='585' font-size='11' fill='#1d2733' text-anchor='start'>• sudo bash install.sh --importar perfil.owrx.tar.gz  → paso «importar» (IMPORTAR_NIVELES)</text><text x='50' y='615' font-size='11' fill='#1d2733' text-anchor='start'>• marca /etc/bricohams/perfil-importado: «configuracion» no regenera settings.json y «plugins» no pisa init.js</text><text x='50' y='645' font-size='11' fill='#1d2733' text-anchor='start'>• OWRX_PLANTILLA="yes" vuelve a la plantilla de BricoHams</text><text x='50' y='675' font-size='11' fill='#1d2733' text-anchor='start'>• copia diaria: /var/backups/bricohams/perfil-owrx-FECHA.owrx.tar.gz (cinco días)</text><text x='30' y='800' font-size='11.5' fill='#1d2733' text-anchor='start'>owrx-clone es genérico: cualquier OpenWebRX+ en Debian 11-13, Ubuntu 22.04/24.04 o Raspberry Pi OS (amd64, arm64, armhf).</text><text x='30' y='826' font-size='11' fill='#5f6b78' text-anchor='start'>Un solo fichero Python 3 sin dependencias · README es/en · man owrx-clone · owrx-clone ayuda {niveles,seguridad,dispositivos,migrar,problemas} · MIT</text></svg>