><rect x='815.0' y='282.0' width='4' height='36.0' fill='#F26B1D'/><rect x='897.0' y='282.0' width='4' height='36.0' fill='#F26B1D'/><rect x='873.0' y='156.0' width='39.0' height='90.0' fill='#fff' fill-opacity='0.85' stroke='#1565c0' stroke-width='1.6'/><text x='892.5' y='199.0' font-size='10' fill='#1565c0' font-weight="bold" text-anchor='middle'>S5</text><text x='892.5' y='212.0' font-size='8.5' fill='#59636B' text-anchor='middle'>vertical</text><rect x='873.0' y='152.0' width='39.0' height='4' fill='#F26B1D'/><rect x='873.0' y='246.0' width='39.0' height='4' fill='#F26B1D'/><text x='955.5' y='108' font-size='13' fill='#AA410B' font-weight="bold" text-anchor='start'>bandeja Pi 170 × 92 (+131 mm)</text><rect x='955.5' y='120' width='255.0' height='138.0' fill='#fffde7' stroke='#23272B' stroke-width='2'/><rect x='967.5' y='159.0' width='127.5' height='84.0' fill='#fff' fill-opacity='0.85' stroke='#2e7d32' stroke-width='1.6' stroke-dasharray='5 3'/><text x='1031.25' y='199.0' font-size='10' fill='#2e7d32' font-weight="bold" text-anchor='middle'>Pi 5 + HAT</text><text x='1031.25' y='212.0' font-size='8.5' fill='#59636B' text-anchor='middle'>M2.5 · 58 × 49</text><rect x='1102.5' y='138.89999999999998' width='44.099999999999994' height='101.10000000000001' fill='#fff' fill-opacity='0.85' stroke='#00838f' stroke-width='1.6' stroke-dasharray='5 3'/><text x='1124.55' y='187.45' font-size='10' fill='#00838f' font-weight="bold" text-anchor='middle'>LilyGO</text><text x='1124.55' y='200.45' font-size='8.5' fill='#59636B' text-anchor='middle'>soporte_lilygo</text><rect x='1149.0' y='145.8' width='49.199999999999996' height='94.19999999999999' fill='#fff' fill-opacity='0.85' stroke='#00838f' stroke-width='1.6' stroke-dasharray='5 3'/><text x='1173.6' y='190.9' font-size='10' fill='#00838f' font-weight="bold" text-anchor='middle'>RAK</text><text x='1173.6' y='203.9' font-size='8.5' fill='#59636B' text-anchor='middle'>soporte_rak</text><rect x='30' y='472.5' width='20' height='5' fill='#F26B1D'/><text x='58' y='478.5' font-size='10.5' fill='#23272B' text-anchor='start'>barra naranja = cara hacia la que miran los conectores (N = arriba del dibujo, S = hacia la pared de pasamuros)</text><text x='30' y='502.5' font-size='10.5' fill='#23272B' text-anchor='start'>Cotas del .scad (EL_RES, SDR_DECK, SDR_DECK2, PI_OFF) relativas a la esquina inferior izquierda de cada placa. Rayado = orientación PENDIENTE DE CONFIRMAR.</text><text x='30' y='519.5' font-size='10.5' fill='#23272B' text-anchor='start'>La bahía del RSPdx (100 × 90) sobresale ≈ 3 mm de la placa (210,8): se dibuja el volumen de 98 × 88. Postes: 38 / 41 / 46 mm.</text><text x='30' y='536.5' font-size='10.5' fill='#23272B' text-anchor='start'>HackRF: SMA a la izquierda y USB a la derecha (manual 17). Dongles verticales: USB hacia el hub (N), SMA hacia la pared N (S).</text><text x='30' y='553.5' font-size='10.5' fill='#23272B' text-anchor='start'>Fuente: hardware/caja_v3/caja_v3.scad · manual 17 · manual 52, capítulo 6 bis.</text></svg>