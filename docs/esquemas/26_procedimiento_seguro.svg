<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Instalacion y mantenimiento seguros</title>
  <desc id="desc">Elegir modulo, revisar requisitos, guardar y verificar backup y restauracion. Solo si todo es correcto aplicar cambios y comprobar. Si falla la copia, detenerse. Si falla el modulo, diagnosticar o restaurar.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6" fill="#334155"/></marker></defs>
  <rect width="1000" height="560" rx="18" fill="#f8fafc"/>
  <g font-family="sans-serif" fill="#0f172a">
    <text x="35" y="43" font-size="25" font-weight="bold">Antes de tocar una estacion existente</text>
    <text x="35" y="73" font-size="16">Ilustracion de procedimiento. No es una captura ni una prueba de despliegue.</text>
    <g fill="#e0f2fe" stroke="#0369a1" stroke-width="2">
      <rect x="35" y="105" width="270" height="100" rx="12"/>
      <rect x="365" y="105" width="270" height="100" rx="12"/>
      <rect x="695" y="105" width="270" height="100" rx="12"/>
    </g>
    <g font-size="18" text-anchor="middle">
      <text x="170" y="140">1. Elegir modulo</text><text x="170" y="170">Requisitos + hardware</text>
      <text x="500" y="140">2. Guardar estado previo</text><text x="500" y="170">Archivos + datos + config</text>
      <text x="830" y="140">3. Verificar copia</text><text x="830" y="170">Integridad + restauracion</text>
    </g>
    <g stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
      <path d="M305 155 H365"/><path d="M635 155 H695"/>
      <path d="M830 205 V255 H605 V305"/>
      <path d="M830 205 V245 H170 V305"/>
      <path d="M735 355 H800"/>
      <path d="M865 405 V455 H605"/>
    </g>
    <text x="380" y="240" font-size="16">NO verificada</text>
    <text x="660" y="282" font-size="16">Verificada</text>
    <rect x="35" y="305" width="270" height="100" rx="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
    <rect x="470" y="305" width="265" height="100" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <rect x="800" y="305" width="165" height="100" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
    <g font-size="18" text-anchor="middle">
      <text x="170" y="343" font-weight="bold">DETENERSE</text><text x="170" y="375">No instalar / no desplegar</text>
      <text x="603" y="343">4. Aplicar el modulo</text><text x="603" y="375">--solo pasos_elegidos</text>
      <text x="882" y="343">5. Comprobar</text><text x="882" y="375">Uso real + logs</text>
    </g>
    <rect x="35" y="445" width="570" height="75" rx="12" fill="#fef3c7" stroke="#a16207" stroke-width="2"/>
    <text x="55" y="475" font-size="17">Si falla: conservar logs, corregir causa o restaurar la copia.</text>
    <text x="55" y="503" font-size="17">Si funciona: registrar resultado y conservar backup protegido.</text>
  </g>
</svg>
