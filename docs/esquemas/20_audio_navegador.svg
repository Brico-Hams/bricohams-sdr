ll='#00695c' text-anchor='start'>websocket</text><rect x='400' y='80' width='1070' height='380' rx='6' fill='#f4f8fd' stroke='#1565c0' stroke-width='1.8'/><text x='935.0' y='100' font-size='11.5' fill='#1565c0' font-weight="bold" text-anchor='middle'>Navegador de CADA oyente (Web Audio API)</text><rect x='420' y='125' width='150' height='60' rx='6' fill='#f7f9fb' stroke='#1d2733' stroke-width='1.8'/><text x='495.0' y='151.0' font-size='11.5' fill='#1d2733' font-weight="bold" text-anchor='middle'>AudioWorklet</text><text x='495.0' y='166.0' font-size='9.5' fill='#5f6b78' text-anchor='middle'>audioNode</text><text x='600' y='222' font-size='11.5' fill='#F26B21' font-weight="bold" text-anchor='start'>FILTRO · filtro_audio (orden 10)</text><rect x='600' y='125' width='104' height='60' rx='6' fill='#fff3e0' stroke='#F26B21' stroke-width='1.8'/><text x='652.0' y='151.0' font-size='11.5' fill='#F26B21' font-weight="bold" text-anchor='middle'>2× pasa-altos</text><text x='652.0' y='166.0' font-size='9.5' fill='#5f6b78' text-anchor='middle'>corte bajo</text><rect x='712' y='125' width='104' height='60' rx='6' fill='#fff3e0' stroke='#F26B21' stroke-width='1.8'/><text x='764.0' y='151.0' font-size='11.5' fill='#F26B21' font-weight="bold" text-anchor='middle'>2× pasa-bajos</text><text x='764.0' y='166.0' font-size='9.5' fill='#5f6b78' text-anchor='middle'>corte alto</text><line x1='704' y1='155' x2='712' y2='155' stroke='#F26B21' stroke-width='1.5' marker-end='url(#aF26B21)'/><rect x='824' y='125' width='104' height='60' rx='6' fill='#fff3e0' stroke='#F26B21' stroke-width='1.8'/><text x='876.0' y='151.0' font-size='11.5' fill='#F26B21' font-weight="bold" text-anchor='middle'>notch manual</text><text x='876.0' y='166.0' font-size='9.5' fill='#5f6b78' text-anchor='middle'>Hz · Q</text><line x1='816' y1='155' x2='824' y2='155' stroke='#F26B21' stroke-width='1.5' marker-end='url(#aF26B21)'/><rect x='936' y='125' width='104' height='60' rx='6' fill='#fff3e0' stroke='#F26B21' stroke-width='1.8'/><text x='988.0' y='151.0' font-size='11.5' fill='#F26B21' font-weight="bold" text-anchor='middle'>notch auto</text><text x='988.0' y='166.0' font-size='9.5' fill='#5f6b78' text-anchor='middle'>sigue el pitido</text><line x1='928' y1='155' x2='936' y2='155' stroke='#F26B21' stroke-width='1.5' marker-end='url(#aF26B21)'/><line x1='570' y1='155' x2='600' y2='155' stroke='#1d2733' stroke-width='2' marker-end='url(#a1d2733)'/><text x='470' y='362' font-size='11.5' fill='#A6192E' font-weight="bold" text-anchor='start'>DSP · dsp_audio (orden 20)</text><rect x='470' y='270' width='108' height='60' rx='6' fill='#fdecee' stroke='#A6192E' stroke-width='1.8'/><text x='524.0' y='296.0' font-size='11.5' fill='#A6192E' font-weight="bold" text-anchor='middle'>graves</text><text x='524.0' y='311.0' font-size='9.5' fill='#5f6b78' text-anchor='middle'>250 Hz</text><rect x='588' y='270' width='108' height='60' rx='6' fill='#fdecee' stroke='#A6192E' stroke-width='1.8'/><text x='642.0' y='296.0' font-size='11.5' fill='#A6192E' font-weight="bold" text-anchor='middle'>medios</text><text x='642.0' y='311.0' font-size='9.5' fill='#5f6b78' text-anchor='middle'>1,2 kHz</text><line x1='578' y1='300' x2='588' y2='300' stroke='#A6192E' stroke-width='1.5' marker-end='url(#aA6192E)'/><rect x='706' y='270' width='108' height='60' rx='6' fill='#fdecee' stroke='#A6192E' stroke-width='1.8'/><text x='760.0' y='296.0' font-size='11.5' fill='#A6192E' font-weight="bold" text-anchor='middle'>agudos</text><text x='760.0' y='311.0' font-size='9.5' fill='#5f6b78' text-anchor='middle'>3 kHz</text><line x1='696' y1='300' x2='706' y2='300' stroke='#A6192E' stroke-width='1.5' marker-end='url(#aA6192E)'/><rect x='824' y='270' width='108' height='60' rx='6' fill='#fdecee' stroke='#A6192E' stroke-width='1.8'/><text x='878.0' y='296.0' font-size='11.5' fill='#A6192E' font-weight="bold" text-anchor='middle'>puerta</text><text x='878.0' y='311.0' font-size='9.5' fill='#5f6b78' text-anchor='middle'>−30 dB</text><line x1='814' y1='300' x2='824' y2='300' stroke='#A6192E' stroke-width='1.5' marker-end='url(#aA6192E)'/><rect x='942' y='270' width='108' height='60' rx='6' fill='#fdecee' stroke='#A6192E' stroke-width='1.8'/><text x='996.0' y='296.0' font-size='11.5' fill='#A6192E' font-weight="bold" text-anchor='middle'>AGC</text><text x='996.0' y='311.0' font-size='9.5' fill='#5f6b78' text-anchor='middle'>compresor</text><line x1='932' y1='300' x2='942' y2='300' stroke='#A6192E' stroke-width='1.5' marker-end='url(#aA6192E)'/><rect x='1060' y='270' width='108' height='60' rx='6' fill='#fdecee' stroke='#A6192E' stroke-width='1.8'/><text x='1114.0' y='296.0' font-size='11.5' fill='#A6192E' font-weight="bold" text-anchor='middle'>compensa</text><text x='1114.0' y='311.0' font-size='9.5' fill='#5f6b78' text-anchor='middle'>+dB</text><line x1='1050' y1='300' x2='1060' y2='300' stroke='#A6192E' stroke-width='1.5' marker-end='url(#aA6192E)'/><rect x='1178' y='270' width='108' height='60' rx='6' fill='#fdecee' stroke='#A6192E' stroke-width='1.8'/><text x='1232.0' y='296.0' font-size='11.5' fill='#A6192E' font-weight="bold" text-anchor='middle'>limitador</text><text x='1232.0' y='311.0' font-size='9.5' fill='#5f6b78' text-anchor='middle'>−1 dBFS</text><line x1='1168' y1='300' x2='1178' y2='300' stroke='#A6192E' stroke-width='1.5' marker-end='url(#aA6192E)'/><line x1='1032' y1='185' x2='1032' y2='230' stroke='#1d2733' stroke-width='2'/><line x1='1032' y1='230' x2='525' y2='230' stroke='#1d2733' stroke-width='2'/><line x1='525' y1='230' x2='525' y2='270' stroke='#1d2733' stroke-width='2' marker-end='url(#a1d2733)'/><rect x='1300' y='380' width='150' height='60' rx='6' fill='#f7f9fb' stroke='#1d2733' stroke-width='1.8'/><text x='1375.0' y='406.0' font-size='11.5' fill='#1d2733' font-weight="bold" text-anchor='middle'>volumen</text><text x='1375.0' y='421.0' font-size='9.5' fill='#5f6b78' text-anchor='middle'>gainNode</text><line x1='1290' y1='300' x2='1375' y2='300' stroke='#1d2733' stroke-width='2'/><line x1='1375' y1='300' x2='1375' y2='380' stroke='#1d2733' stroke-width='2' marker-end='url(#a1d2733)'/><rect x='1300' y='470' width='150' height='50' rx='6' fill='#edf7ee' stroke='#2e7d32' stroke-width='1.8'/><text x='1375.0' y='495.0' font-size='11.5' fill='#2e7d32' font-weight="bold" text-anchor='middle'>altavoz</text><line x1='1375' y1='440' x2='1375' y2='470' stroke='#1d2733' stroke-width='2' marker-end='url(#a1d2733)'/><text x='420' y='420' font-size='11' fill='#1d2733' text-anchor='start'>audio_cadena: mete las etapas ACTIVAS entre audioNode y volumen, por orden. Todo apagado = audio original.</text><text x='420' y='442' font-size='11' fill='#5f6b78' text-anchor='start'>Mover un deslizador solo cambia parámetros (sin recablear, sin chasquidos).</text><rect x='30' y='520' width='1180' height='190' rx='6' fill='#fafafa' stroke='#5f6b78' stroke-width='1.8'/><text x='620.0' y='540' font-size='11.5' fill='#5f6b78' font-weight="bold" text-anchor='middle'>Lo que NO cambia</text><text x='55' y='575' font-size='11.2' fill='#1d2733' text-anchor='start'>• La Raspberry no hace nada más: cada oyente procesa su propio audio en su navegador.</text><text x='55' y='601' font-size='11.2' fill='#1d2733' text-anchor='start'>• Los demás oyentes oyen lo suyo: los ajustes se guardan en el navegador de cada uno (localStorage).</text><text x='55' y='627' font-size='11.2' fill='#1d2733' text-anchor='start'>• Los decodificadores (FT8, DMR, APRS, ADS-B…) van en el servidor con la señal original.</text><text x='55' y='653' font-size='11.2' fill='#1d2733' text-anchor='start'>• La grabación del botón REC guarda el audio original, sin procesar.</text><text x='55' y='679' font-size='11.2' fill='#1d2733' text-anchor='start'>• Botones FILTRO y DSP en la barra superior; apagados por defecto (init.js: activo: true para encenderlos).</text></svg>