<svg xmlns='http://www.w3.org/2000/svg' width='1400' height='880' viewBox='0 0 1400 880' font-family='DejaVu Sans, Arial, sans-serif'><rect width='1400' height='880' fill='#ffffff'/><text x='24' y='36' font-size='22' font-weight='bold' fill='#1d2733'>Ventilación de la caja: conexión y control desde la Raspberry</text><text x='24' y='58' font-size='12' fill='#5f6b78'>BricoHams SDR · generado por tools/esquemas.py</text><rect x='0' y='872' width='1400' height='8' fill='#F26B21'/><rect x='0' y='870' width='1400' height='2' fill='#A6192E'/><defs><marker id='ac62828' markerWidth='10' markerHeight='8' refX='9' refY='4' orient='auto'><path d='M0,0 L10,4 L0,8 z' fill='#c62828'/></marker></defs><rect x='40' y='100' width='230' height='390' rx='6' fill='#edf7ee' stroke='#2e7d32' stroke-width='1.8'/><text x='155.0' y='120' font-size='11.5' fill='#2e7d32' font-weight="bold" text-anchor='middle'>Raspberry Pi 5</text><text x='155.0' y='136' font-size='9.5' fill='#5f6b78' text-anchor='middle'>cabecera de 40 pines</text><text x='260' y='170' font-size='10.5' fill='#1d2733' text-anchor='end'>pin 32 · GPIO12 (PWM0 c0)</text><line x1='270' y1='166' x2='330' y2='166' stroke='#1d2733' stroke-width='1.5'/><text x='260' y='220' font-size='10.5' fill='#1d2733' text-anchor='end'>pin 33 · GPIO13 (PWM0 c1)</text><line x1='270' y1='216' x2='330' y2='216' stroke='#1d2733' stroke-width='1.5'/><text x='260' y='290' font-size='10.5' fill='#1d2733' text-anchor='end'>pin 15 · GPIO22 (tacómetro 1)</text><line x1='270' y1='286' x2='330' y2='286' stroke='#1d2733' stroke-width='1.5'/><text x='260' y='340' font-size='10.5' fill='#1d2733' text-anchor='end'>pin 29 · GPIO5 (tacómetro 2)</text><line x1='270' y1='336' x2='330' y2='336' stroke='#1d2733' stroke-width='1.5'/><text x='260' y='410' font-size='10.5' fill='#1d2733' text-anchor='end'>pin 7 · GPIO4 (1-Wire)</text><line x1='270' y1='406' x2='330' y2='406' stroke='#1d2733' stroke-width='1.5'/><text x='260' y='450' font-size='10.5' fill='#1d2733' text-anchor='end'>pin 1 · 3V3</text><line x1='270' y1='446' x2='330' y2='446' stroke='#1d2733' stroke-width='1.5'/><text x='260' y='470' font-size='10.5' fill='#1d2733' text-anchor='end'>pin 39 · GND</text><line x1='270' y1='466' x2='330' y2='466' stroke='#1d2733' stroke-width='1.5'/><rect x='500' y='130' width='230' height='120' rx='6' fill='#f7f9fb' stroke='#6a1b9a' stroke-width='1.8'/><text x='615.0' y='186.0' font-size='11.5' fill='#6a1b9a' font-weight="bold" text-anchor='middle'>Q1 · 2N7002 (o BSS138)</text><text x='615.0' y='201.0' font-size='9.5' fill='#5f6b78' text-anchor='middle'>G ← 1 kΩ ← GPIO · 100 kΩ G–S · S a GND</text><line x1='330' y1='166' x2='500' y2='170' stroke='#6a1b9a' stroke-width='1.5'/><rect x='840' y='130' width='270' height='120' rx='6' fill='#eef4fb' stroke='#1565c0' stroke-width='1.8'/><text x='975.0' y='186.0' font-size='11.5' fill='#1565c0' font-weight="bold" text-anchor='middle'>Ventilador 1 · 60 mm 12 V PWM</text><text x='975.0' y='201.0' font-size='9.5' fill='#5f6b78' text-anchor='middle'>ENTRADA (abajo izq.)</text><line x1='730' y1='190' x2='840' y2='190' stroke='#6a1b9a' stroke-width='1.8'/><text x='785' y='184' font-size='10' fill='#6a1b9a' text-anchor='middle'>D → PWM (azul)</text><text x='1120' y='156' font-size='10.5' fill='#37474f' text-anchor='start'>negro · GND</text><text x='1120' y='178' font-size='10.5' fill='#c62828' text-anchor='start'>amarillo · +12 V</text><text x='1120' y='200' font-size='10.5' fill='#ef6c00' text-anchor='start'>verde · TACH</text><text x='1120' y='222' font-size='10.5' fill='#6a1b9a' text-anchor='start'>azul · PWM</text><rect x='500' y='300' width='230' height='120' rx='6' fill='#f7f9fb' stroke='#6a1b9a' stroke-width='1.8'/><text x='615.0' y='356.0' font-size='11.5' fill='#6a1b9a' font-weight="bold" text-anchor='middle'>Q2 · 2N7002 (o BSS138)</text><text x='615.0' y='371.0' font-size='9.5' fill='#5f6b78' text-anchor='middle'>G ← 1 kΩ ← GPIO · 100 kΩ G–S · S a GND</text><line x1='330' y1='216' x2='500' y2='340' stroke='#6a1b9a' stroke-width='1.5'/><rect x='840' y='300' width='270' height='120' rx='6' fill='#eef4fb' stroke='#1565c0' stroke-width='1.8'/><text x='975.0' y='356.0' font-size='11.5' fill='#1565c0' font-weight="bold" text-anchor='middle'>Ventilador 2 · 60 mm 12 V PWM</text><text x='975.0' y='371.0' font-size='9.5' fill='#5f6b78' text-anchor='middle'>SALIDA (arriba dcha.)</text><line x1='730' y1='360' x2='840' y2='360' stroke='#6a1b9a' stroke-width='1.8'/><text x='785' y='354' font-size='10' fill='#6a1b9a' text-anchor='middle'>D → PWM (azul)</text><text x='1120' y='326' font-size='10.5' fill='#37474f' text-anchor='start'>negro · GND</text><text x='1120' y='348' font-size='10.5' fill='#c62828' text-anchor='start'>amarillo · +12 V</text><text x='1120' y='370' font-size='10.5' fill='#ef6c00' text-anchor='start'>verde · TACH</text><text x='1120' y='392' font-size='10.5' fill='#6a1b9a' text-anchor='start'>azul · PWM</text><line x1='330' y1='286' x2='1180' y2='286' stroke='#ef6c00' stroke-width='1.5' stroke-dasharray='6 4'/><line x1='1180' y1='286' x2='1180' y2='196' stroke='#ef6c00' stroke-width='1.5' stroke-dasharray='6 4'/><line x1='330' y1='336' x2='470' y2='336' stroke='#ef6c00' stroke-width='1.5' stroke-dasharray='6 4'/><line x1='470' y1='336' x2='470' y2='440' stroke='#ef6c00' stroke-width='1.5' stroke-dasharray='6 4'/><line x1='470' y1='440' x2='1180' y2='440' stroke='#ef6c00' stroke-width='1.5' stroke-dasharray='6 4'/><line x1='1180' y1='440' x2='1180' y2='366' stroke='#ef6c00' stroke-width='1.5' stroke-dasharray='6 4'/><text x='560' y='278' font-size='10' fill='#ef6c00' text-anchor='start'>TACH 1 (verde) → GPIO22 · pull-up 10 kΩ a 3V3 (pin 1) + 1 kΩ en serie</text><text x='560' y='456' font-size='10' fill='#ef6c00' text-anchor='start'>TACH 2 (verde) → GPIO5 · igual</text><rect x='500' y='500' width='230' height='90' rx='6' fill='#f7f9fb' stroke='#2e7d32' stroke-width='1.8'/><text x='615.0' y='541.0' font-size='11.5' fill='#2e7d32' font-weight="bold" text-anchor='middle'>DS18B20 (interior de la caja)</text><text x='615.0' y='556.0' font-size='9.5' fill='#5f6b78' text-anchor='middle'>DQ ← GPIO4 · 4,7 kΩ DQ–3V3</text><line x1='330' y1='406' x2='500' y2='545' stroke='#2e7d32' stroke-width='1.5'/><rect x='840' y='520' width='270' height='80' rx='6' fill='#fdecea' stroke='#c62828' stroke-width='1.8'/><text x='975.0' y='556.0' font-size='11.5' fill='#c62828' font-weight="bold" text-anchor='middle'>Bus 12 V (WAGO) · fusible 1 A</text><text x='975.0' y='571.0' font-size='9.5' fill='#5f6b78' text-anchor='middle'>del gatillo USB-C PD del módulo de potencia</text><line x1='975' y1='520' x2='975' y2='430' stroke='#c62828' stroke-width='2'/><line x1='975' y1='300' x2='975' y2='250' stroke='#c62828' stroke-width='2' stroke-dasharray='6 4'/><text x='990' y='470' font-size='10' fill='#c62828' text-anchor='start'>+12 V a los dos ventiladores</text><text x='40' y='660' font-size='11.2' fill='#1d2733' text-anchor='start'>• El 2N7002 invierte la señal (GPIO alto → PWM a masa): por eso FAN_PWM_INVERT="yes". Sin MOSFET (PWM directo con 3,3 V, admitido por casi todos los ventiladores de 4 hilos): FAN_PWM_INVERT="no".</text><text x='40' y='686' font-size='11.2' fill='#1d2733' text-anchor='start'>• Masa común: el GND de la Pi y el negativo del bus de 12 V tienen que estar unidos (en el WAGO de masa).</text><text x='40' y='712' font-size='11.2' fill='#1d2733' text-anchor='start'>• PWM por hardware a 25 kHz: dtoverlay=pwm-2chan,pin=12,func=4,pin2=13,func2=4 (lo escribe el instalador). Si no aparece pwmchip, bricohams-fan usa PWM por software (lgpio).</text><text x='40' y='738' font-size='11.2' fill='#1d2733' text-anchor='start'>• Curva: arrancan con la caja a 35 °C o la CPU a 55 °C (30 %); al 100 % con 45 °C / 75 °C; histéresis de 3 °C. Golpe al 100 % al arrancar desde parado.</text><text x='40' y='764' font-size='11.2' fill='#1d2733' text-anchor='start'>• Alarma: si el ciclo es ≥ 40 % y un tacómetro marca &lt; 300 rpm, bricohams-check y la web (tarjeta METEO) avisan del ventilador parado.</text><text x='40' y='790' font-size='11.2' fill='#1d2733' text-anchor='start'>• Flujo: entra abajo a la izquierda con filtro de malla y sale arriba a la derecha; las dos bocas tienen capota impresa con la abertura hacia abajo.</text></svg>