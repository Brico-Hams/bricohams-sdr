<svg xmlns='http://www.w3.org/2000/svg' width='1500' height='900' viewBox='0 0 1500 900' font-family='DejaVu Sans, Arial, sans-serif'><rect width='1500' height='900' fill='#ffffff'/><text x='24' y='36' font-size='22' font-weight='bold' fill='#1d2733'>Blindaje de seguridad de la estación (v4.4)</text><text x='24' y='58' font-size='12' fill='#5f6b78'>BricoHams SDR · generado por tools/esquemas.py</text><rect x='0' y='892' width='1500' height='8' fill='#F26B21'/><rect x='0' y='890' width='1500' height='2' fill='#A6192E'/><defs><marker id='a00695c' markerWidth='10' markerHeight='8' refX='9' refY='4' orient='auto'><path d='M0,0 L10,4 L0,8 z' fill='#00695c'/></marker><marker id='a1565c0' markerWidth='10' markerHeight='8' refX='9' refY='4' orient='auto'><path d='M0,0 L10,4 L0,8 z' fill='#1565c0'/></marker><marker id='a1d2733' markerWidth='10' markerHeight='8' refX='9' refY='4' orient='auto'><path d='M0,0 L10,4 L0,8 z' fill='#1d2733'/></marker><marker id='a2e7d32' markerWidth='10' markerHeight='8' refX='9' refY='4' orient='auto'><path d='M0,0 L10,4 L0,8 z' fill='#2e7d32'/></marker><marker id='aA6192E' markerWidth='10' markerHeight='8' refX='9' refY='4' orient='auto'><path d='M0,0 L10,4 L0,8 z' fill='#A6192E'/></marker><marker id='aF26B21' markerWidth='10' markerHeight='8' refX='9' refY='4' orient='auto'><path d='M0,0 L10,4 L0,8 z' fill='#F26B21'/></marker></defs><rect x='30' y='90' width='250' height='300' rx='6' fill='#fdecee' stroke='#A6192E' stroke-width='1.8'/><text x='155.0' y='110' font-size='11.5' fill='#A6192E' font-weight="bold" text-anchor='middle'>Internet</text><text x='155.0' y='126' font-size='9.5' fill='#5f6b78' text-anchor='middle'>sdr.example.org</text><text x='50' y='160' font-size='11' fill='#1d2733' text-anchor='start'>oyentes</text><text x='50' y='186' font-size='11' fill='#1d2733' text-anchor='start'>robots que prueban</text><text x='50' y='212' font-size='11' fill='#1d2733' text-anchor='start'>contraseñas</text><text x='50' y='238' font-size='11' fill='#1d2733' text-anchor='start'>directorios de</text><text x='50' y='264' font-size='11' fill='#1d2733' text-anchor='start'>receptores</text><rect x='330' y='90' width='230' height='300' rx='6' fill='#fff3e0' stroke='#F26B21' stroke-width='1.8'/><text x='445.0' y='110' font-size='11.5' fill='#F26B21' font-weight="bold" text-anchor='middle'>Cortafuegos externo</text><text x='445.0' y='126' font-size='9.5' fill='#5f6b78' text-anchor='middle'>(router)</text><text x='350' y='165' font-size='12' fill='#1d2733' font-weight="bold" text-anchor='start'>80 → Pi</text><text x='350' y='197' font-size='12' fill='#1d2733' font-weight="bold" text-anchor='start'>443 → Pi</text><text x='350' y='229' font-size='12' fill='#1d2733' font-weight="bold" text-anchor='start'>8073 → Pi (!)</text><text x='350' y='261' font-size='12' fill='#1d2733' text-anchor='start'>nada más</text><text x='350' y='320' font-size='10.5' fill='#A6192E' text-anchor='start'>(!) /login por 8073 va</text><text x='350' y='338' font-size='10.5' fill='#A6192E' text-anchor='start'>sin cifrar: ciérralo</text><line x1='280' y1='240' x2='330' y2='240' stroke='#A6192E' stroke-width='2' marker-end='url(#aA6192E)'/><line x1='560' y1='240' x2='610' y2='240' stroke='#1d2733' stroke-width='2' marker-end='url(#a1d2733)'/><rect x='610' y='90' width='860' height='600' rx='6' fill='#eef4fb' stroke='#1565c0' stroke-width='1.8'/><text x='1040.0' y='110' font-size='11.5' fill='#1565c0' font-weight="bold" text-anchor='middle'>Raspberry Pi 5 · 192.168.1.50</text><text x='1040.0' y='126' font-size='9.5' fill='#5f6b78' text-anchor='middle'>bricohams-blindaje aplicar · confirmar · deshacer</text><rect x='630' y='150' width='820' height='70' rx='6' fill='#ffffff' stroke='#F26B21' stroke-width='1.8'/><text x='1040.0' y='181.0' font-size='11.5' fill='#F26B21' font-weight="bold" text-anchor='middle'>Cortafuegos del host (nftables)</text><text x='1040.0' y='196.0' font-size='9.5' fill='#5f6b78' text-anchor='middle'>público 80/443/8073 · LAN: SSH, 4403, 8443, 8554 · resto: descartado y registrado</text><rect x='630' y='234' width='820' height='70' rx='6' fill='#ffffff' stroke='#00695c' stroke-width='1.8'/><text x='1040.0' y='265.0' font-size='11.5' fill='#00695c' font-weight="bold" text-anchor='middle'>nginx</text><text x='1040.0' y='280.0' font-size='9.5' fill='#5f6b78' text-anchor='middle'>/settings → HTTPS · /login 12/min (429) · sin versión · X-Frame · ocultos 404</text><rect x='630' y='318' width='820' height='70' rx='6' fill='#ffffff' stroke='#2e7d32' stroke-width='1.8'/><text x='1040.0' y='349.0' font-size='11.5' fill='#2e7d32' font-weight="bold" text-anchor='middle'>SSH</text><text x='1040.0' y='364.0' font-size='9.5' fill='#5f6b78' text-anchor='middle'>solo LAN · sin root · 3 intentos · solo clave si la hay · fail2ban</text><rect x='630' y='402' width='820' height='70' rx='6' fill='#ffffff' stroke='#A6192E' stroke-width='1.8'/><text x='1040.0' y='433.0' font-size='11.5' fill='#A6192E' font-weight="bold" text-anchor='middle'>Claves</text><text x='1040.0' y='448.0' font-size='9.5' fill='#5f6b78' text-anchor='middle'>bricohams.env 600 · .env 640 · copias 700 · users.json 600 · fugas: buscadas</text><rect x='630' y='486' width='820' height='70' rx='6' fill='#ffffff' stroke='#1565c0' stroke-width='1.8'/><text x='1040.0' y='517.0' font-size='11.5' fill='#1565c0' font-weight="bold" text-anchor='middle'>Privacidad</text><text x='1040.0' y='532.0' font-size='9.5' fill='#5f6b78' text-anchor='middle'>posición pública a 2 decimales (~1 km): mapa, status.json, init.js, meteo, pases</text><rect x='630' y='570' width='820' height='70' rx='6' fill='#ffffff' stroke='#1d2733' stroke-width='1.8'/><text x='1040.0' y='601.0' font-size='11.5' fill='#1d2733' font-weight="bold" text-anchor='middle'>Sistema</text><text x='1040.0' y='616.0' font-size='9.5' fill='#5f6b78' text-anchor='middle'>unattended-upgrades · sysctl · UMask 0027 · Bluetooth fuera</text><rect x='30' y='430' width='530' height='260' rx='6' fill='#fafafa' stroke='#1d2733' stroke-width='1.8'/><text x='295.0' y='450' font-size='11.5' fill='#1d2733' font-weight="bold" text-anchor='middle'>Procedimiento (manual 34)</text><text x='50' y='485' font-size='11' fill='#1d2733' text-anchor='start'>1 sudo bash install.sh --actualizar</text><text x='50' y='513' font-size='11' fill='#1d2733' text-anchor='start'>2 sudo bricohams-blindaje auditar  (no cambia nada)</text><text x='50' y='541' font-size='11' fill='#1d2733' text-anchor='start'>3 ssh-copy-id pi@192.168.1.50</text><text x='50' y='569' font-size='11' fill='#1d2733' text-anchor='start'>4 sudo bricohams-blindaje aplicar</text><text x='50' y='597' font-size='11' fill='#1d2733' text-anchor='start'>5 otra ventana: ¿entro? ¿va la web?</text><text x='50' y='625' font-size='11' fill='#1d2733' text-anchor='start'>6 sudo bricohams-blindaje confirmar (si no, 3 min y se quita)</text><text x='50' y='653' font-size='11' fill='#1d2733' text-anchor='start'>7 sudo bricohams-blindaje auditar</text><text x='30' y='760' font-size='11' fill='#1d2733' text-anchor='start'>La auditoría nunca enseña una clave: solo la variable y el fichero donde aparece. bricohams-check muestra el resumen cada 30 min.</text><text x='30' y='860' font-size='11' fill='#5f6b78' text-anchor='start'>HAT, Mini RTL-SDR y SDRplay pendientes: sus errores no son de seguridad. Manual 34 · ADR-47 y ADR-48.</text></svg>