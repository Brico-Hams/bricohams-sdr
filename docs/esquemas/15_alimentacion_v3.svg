<svg xmlns='http://www.w3.org/2000/svg' width='1400' height='900' viewBox='0 0 1400 900' font-family='DejaVu Sans, Arial, sans-serif'><rect width='1400' height='900' fill='#ffffff'/><text x='24' y='36' font-size='22' font-weight='bold' fill='#1d2733'>Alimentación v3: módulo de potencia → módulo de electrónica</text><text x='24' y='58' font-size='12' fill='#5f6b78'>BricoHams SDR · EA5KAO · Mi QTH (Región de Murcia) · generado por tools/esquemas.py</text><rect x='0' y='892' width='1400' height='8' fill='#F26B21'/><rect x='0' y='890' width='1400' height='2' fill='#A6192E'/><defs><marker id='a1565c0' markerWidth='10' markerHeight='8' refX='9' refY='4' orient='auto'><path d='M0,0 L10,4 L0,8 z' fill='#1565c0'/></marker><marker id='a2e7d32' markerWidth='10' markerHeight='8' refX='9' refY='4' orient='auto'><path d='M0,0 L10,4 L0,8 z' fill='#2e7d32'/></marker><marker id='ac62828' markerWidth='10' markerHeight='8' refX='9' refY='4' orient='auto'><path d='M0,0 L10,4 L0,8 z' fill='#c62828'/></marker></defs><rect x='30' y='140' width='190' height='90' rx='6' fill='#fdecea' stroke='#c62828' stroke-width='1.8'/><text x='125.0' y='181.0' font-size='11.5' fill='#c62828' font-weight="bold" text-anchor='middle'>230 V · red</text><text x='125.0' y='196.0' font-size='9.5' fill='#5f6b78' text-anchor='middle'>diferencial 30 mA · H07RN-F</text><rect x='270' y='110' width='250' height='150' rx='6' fill='#fdecea' stroke='#c62828' stroke-width='1.8'/><text x='395.0' y='181.0' font-size='11.5' fill='#c62828' font-weight="bold" text-anchor='middle'>MÓDULO DE POTENCIA</text><text x='395.0' y='196.0' font-size='9.5' fill='#5f6b78' text-anchor='middle'>base Schuko + cargador USB 120 W</text><line x1='220' y1='185' x2='268' y2='185' stroke='#c62828' stroke-width='2' marker-end='url(#ac62828)'/><text x='248.0' y='181.0' font-size='10.5' fill='#c62828'>PG9</text><rect x='600' y='90' width='220' height='70' rx='6' fill='#f7f9fb' stroke='#2e7d32' stroke-width='1.8'/><text x='710.0' y='121.0' font-size='11.5' fill='#2e7d32' font-weight="bold" text-anchor='middle'>USB-C 1 (PD)</text><text x='710.0' y='136.0' font-size='9.5' fill='#5f6b78' text-anchor='middle'>5 V 3 A → Raspberry Pi 5</text><rect x='600' y='190' width='220' height='70' rx='6' fill='#f7f9fb' stroke='#c62828' stroke-width='1.8'/><text x='710.0' y='221.0' font-size='11.5' fill='#c62828' font-weight="bold" text-anchor='middle'>USB-C 2 + gatillo PD</text><text x='710.0' y='236.0' font-size='9.5' fill='#5f6b78' text-anchor='middle'>12 V (hasta 5 A)</text><rect x='600' y='290' width='220' height='60' rx='6' fill='#f7f9fb' stroke='#9aa6b2' stroke-width='1.8'/><text x='710.0' y='316.0' font-size='11.5' fill='#9aa6b2' font-weight="bold" text-anchor='middle'>USB-A</text><text x='710.0' y='331.0' font-size='9.5' fill='#5f6b78' text-anchor='middle'>reserva</text><line x1='520' y1='185' x2='598' y2='125' stroke='#c62828' stroke-width='2' marker-end='url(#ac62828)'/><line x1='520' y1='185' x2='598' y2='225' stroke='#c62828' stroke-width='2' marker-end='url(#ac62828)'/><line x1='520' y1='185' x2='598' y2='320' stroke='#c62828' stroke-width='2' marker-end='url(#ac62828)'/><rect x='900' y='90' width='230' height='70' rx='6' fill='#edf7ee' stroke='#2e7d32' stroke-width='1.8'/><text x='1015.0' y='121.0' font-size='11.5' fill='#2e7d32' font-weight="bold" text-anchor='middle'>Raspberry Pi 5 + HAT</text><text x='1015.0' y='136.0' font-size='9.5' fill='#5f6b78' text-anchor='middle'>+ cámara · ~8–12 W</text><line x1='820' y1='125' x2='898' y2='125' stroke='#2e7d32' stroke-width='2' marker-end='url(#a2e7d32)'/><text x='863.0' y='121.0' font-size='10.5' fill='#2e7d32'>M25</text><rect x='900' y='190' width='230' height='80' rx='6' fill='#fdecea' stroke='#c62828' stroke-width='1.8'/><text x='1015.0' y='226.0' font-size='11.5' fill='#c62828' font-weight="bold" text-anchor='middle'>Bus 12 V (WAGO 221)</text><text x='1015.0' y='241.0' font-size='9.5' fill='#5f6b78' text-anchor='middle'>portafusibles de cuchilla</text><line x1='820' y1='225' x2='898' y2='225' stroke='#c62828' stroke-width='2' marker-end='url(#ac62828)'/><text x='863.0' y='221.0' font-size='10.5' fill='#c62828'>M25</text><rect x='1160' y='290' width='220' height='70' rx='6' fill='#f7f9fb' stroke='#c62828' stroke-width='1.8'/><text x='1270.0' y='321.0' font-size='11.5' fill='#c62828' font-weight="bold" text-anchor='middle'>2 ventiladores 60 mm</text><text x='1270.0' y='336.0' font-size='9.5' fill='#5f6b78' text-anchor='middle'>fusible 1 A</text><line x1='1015' y1='270' x2='1158' y2='320' stroke='#c62828' stroke-width='2' marker-end='url(#ac62828)'/><rect x='1160' y='380' width='220' height='70' rx='6' fill='#f7f9fb' stroke='#c62828' stroke-width='1.8'/><text x='1270.0' y='411.0' font-size='11.5' fill='#c62828' font-weight="bold" text-anchor='middle'>Viento RS485 (10–30 V)</text><text x='1270.0' y='426.0' font-size='9.5' fill='#5f6b78' text-anchor='middle'>fusible 1 A</text><line x1='1015' y1='270' x2='1158' y2='410' stroke='#c62828' stroke-width='2' marker-end='url(#ac62828)'/><rect x='1160' y='470' width='220' height='70' rx='6' fill='#f7f9fb' stroke='#c62828' stroke-width='1.8'/><text x='1270.0' y='501.0' font-size='11.5' fill='#c62828' font-weight="bold" text-anchor='middle'>Regleta USB Vansuny</text><text x='1270.0' y='516.0' font-size='9.5' fill='#5f6b78' text-anchor='middle'>12 V 2 A · fusible 2 A</text><line x1='1015' y1='270' x2='1158' y2='500' stroke='#c62828' stroke-width='2' marker-end='url(#ac62828)'/><rect x='1120' y='600' width='270' height='230' rx='6' fill='#eef4fb' stroke='#1565c0' stroke-width='1.8'/><text x='1255.0' y='620' font-size='11.5' fill='#1565c0' font-weight="bold" text-anchor='middle'>Regleta USB Vansuny (USB 3.0)</text><text x='1135' y='650' font-size='10.5' fill='#1d2733' text-anchor='start'>• Mini RTL-SDR</text><text x='1135' y='672' font-size='10.5' fill='#1d2733' text-anchor='start'>• RTL-SDR V3</text><text x='1135' y='694' font-size='10.5' fill='#1d2733' text-anchor='start'>• FlightStick</text><text x='1135' y='716' font-size='10.5' fill='#1d2733' text-anchor='start'>• LilyGO Meshtastic</text><text x='1135' y='738' font-size='10.5' fill='#1d2733' text-anchor='start'>• LilyGO iGate</text><text x='1135' y='760' font-size='10.5' fill='#1d2733' text-anchor='start'>• adaptador USB-RS485</text><text x='1135' y='782' font-size='10.5' fill='#1d2733' text-anchor='start'>• inyector MLA-30 (5 V → 12 V)</text><text x='1135' y='804' font-size='10.5' fill='#1d2733' text-anchor='start'>• bias-tee LNA 1090 (5 V)</text><line x1='1270' y1='540' x2='1270' y2='598' stroke='#c62828' stroke-width='2' marker-end='url(#ac62828)'/><line x1='1015' y1='160' x2='1015' y2='180' stroke='#1565c0' stroke-width='1.6' stroke-dasharray='6 4'/><line x1='1130' y1='140' x2='1395' y2='140' stroke='#1565c0' stroke-width='1.6' stroke-dasharray='6 4'/><line x1='1395' y1='140' x2='1395' y2='598' stroke='#1565c0' stroke-width='1.6' stroke-dasharray='6 4'/><text x='1390' y='132' font-size='9.5' fill='#1565c0' text-anchor='end'>datos USB 3.0 (upstream de la regleta a la Pi)</text><text x='30' y='420' font-size='13' fill='#1d2733' font-weight="bold" text-anchor='start'>Presupuesto</text><text x='30' y='448' font-size='10.5' fill='#1d2733' text-anchor='start'>Raspberry Pi 5 + HAT + cámara</text><text x='420' y='448' font-size='10.5' fill='#1d2733' text-anchor='start'>USB-C PD 5 V</text><text x='560' y='448' font-size='10.5' fill='#1d2733' text-anchor='start'>8–12 W</text><text x='680' y='448' font-size='10.5' fill='#1d2733' text-anchor='start'>15 W</text><text x='30' y='470' font-size='10.5' fill='#1d2733' text-anchor='start'>Regleta: 3 SDR + 2 LilyGO + RS485 + LNA + MLA-30</text><text x='420' y='470' font-size='10.5' fill='#1d2733' text-anchor='start'>12 V (regleta)</text><text x='560' y='470' font-size='10.5' fill='#1d2733' text-anchor='start'>7–9 W</text><text x='680' y='470' font-size='10.5' fill='#1d2733' text-anchor='start'>24 W</text><text x='30' y='492' font-size='10.5' fill='#1d2733' text-anchor='start'>2 ventiladores</text><text x='420' y='492' font-size='10.5' fill='#1d2733' text-anchor='start'>12 V</text><text x='560' y='492' font-size='10.5' fill='#1d2733' text-anchor='start'>0–2 W</text><text x='680' y='492' font-size='10.5' fill='#1d2733' text-anchor='start'>—</text><text x='30' y='514' font-size='10.5' fill='#1d2733' text-anchor='start'>Viento RS485</text><text x='420' y='514' font-size='10.5' fill='#1d2733' text-anchor='start'>12 V</text><text x='560' y='514' font-size='10.5' fill='#1d2733' text-anchor='start'>&lt; 1 W</text><text x='680' y='514' font-size='10.5' fill='#1d2733' text-anchor='start'>—</text><text x='30' y='536' font-size='10.5' fill='#1d2733' font-weight="bold" text-anchor='start'>Total</text><text x='420' y='536' font-size='10.5' fill='#1d2733' font-weight="bold" text-anchor='start'></text><text x='560' y='536' font-size='10.5' fill='#1d2733' font-weight="bold" text-anchor='start'>16–24 W</text><text x='680' y='536' font-size='10.5' fill='#1d2733' font-weight="bold" text-anchor='start'>120 W (20 %)</text><text x='30' y='590' font-size='10.8' fill='#1d2733' text-anchor='start'>• Un solo cable de red, una sola fuente: el cargador de 120 W da el USB-C de la Pi y, con un gatillo USB-C PD fijado a 12 V, todo el bus de 12 V.</text><text x='30' y='614' font-size='10.8' fill='#1d2733' text-anchor='start'>• El alimentador FX24E-120200C (12 V 2 A) de la regleta Vansuny queda como repuesto: no hace falta un segundo transformador de 230 V.</text><text x='30' y='638' font-size='10.8' fill='#1d2733' text-anchor='start'>• La Pi negocia 5 A solo con su fuente oficial: con el cargador arranca a 5 V 3 A y limita sus USB a 0,6 A. Todo lo USB va a la regleta alimentada.</text><text x='30' y='662' font-size='10.8' fill='#1d2733' text-anchor='start'>• Masa común entre el bus de 12 V y la Pi (por el USB). Fusibles de cuchilla en cada derivación de 12 V.</text></svg>