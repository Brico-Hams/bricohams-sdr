<svg xmlns='http://www.w3.org/2000/svg' width='1400' height='860' viewBox='0 0 1400 860' font-family='DejaVu Sans, Arial, sans-serif'><rect width='1400' height='860' fill='#ffffff'/><text x='24' y='36' font-size='22' font-weight='bold' fill='#1d2733'>Estación meteorológica: BME280, viento RS485 y pluviómetro</text><text x='24' y='58' font-size='12' fill='#5f6b78'>BricoHams SDR · EA5KAO · Mi QTH (Región de Murcia) · generado por tools/esquemas.py</text><rect x='0' y='852' width='1400' height='8' fill='#F26B21'/><rect x='0' y='850' width='1400' height='2' fill='#A6192E'/><defs><marker id='a9aa6b2' markerWidth='10' markerHeight='8' refX='9' refY='4' orient='auto'><path d='M0,0 L10,4 L0,8 z' fill='#9aa6b2'/></marker></defs><rect x='40' y='100' width='250' height='420' rx='6' fill='#edf7ee' stroke='#2e7d32' stroke-width='1.8'/><text x='165.0' y='120' font-size='11.5' fill='#2e7d32' font-weight="bold" text-anchor='middle'>Raspberry Pi 5</text><text x='165.0' y='136' font-size='9.5' fill='#5f6b78' text-anchor='middle'>I2C · GPIO · USB</text><text x='280' y='170' font-size='10.5' fill='#1d2733' text-anchor='end'>pin 1 · 3V3</text><line x1='290' y1='166' x2='360' y2='166' stroke='#1d2733' stroke-width='1.4'/><text x='280' y='200' font-size='10.5' fill='#1d2733' text-anchor='end'>pin 3 · SDA1</text><line x1='290' y1='196' x2='360' y2='196' stroke='#1d2733' stroke-width='1.4'/><text x='280' y='230' font-size='10.5' fill='#1d2733' text-anchor='end'>pin 5 · SCL1</text><line x1='290' y1='226' x2='360' y2='226' stroke='#1d2733' stroke-width='1.4'/><text x='280' y='260' font-size='10.5' fill='#1d2733' text-anchor='end'>pin 9 · GND</text><line x1='290' y1='256' x2='360' y2='256' stroke='#1d2733' stroke-width='1.4'/><text x='280' y='330' font-size='10.5' fill='#1d2733' text-anchor='end'>pin 11 · GPIO17</text><line x1='290' y1='326' x2='360' y2='326' stroke='#1d2733' stroke-width='1.4'/><text x='280' y='360' font-size='10.5' fill='#1d2733' text-anchor='end'>pin 14 · GND</text><line x1='290' y1='356' x2='360' y2='356' stroke='#1d2733' stroke-width='1.4'/><text x='280' y='450' font-size='10.5' fill='#1d2733' text-anchor='end'>USB (hub)</text><line x1='290' y1='446' x2='360' y2='446' stroke='#1d2733' stroke-width='1.4'/><rect x='560' y='130' width='260' height='120' rx='6' fill='#f7f9fb' stroke='#2e7d32' stroke-width='1.8'/><text x='690.0' y='186.0' font-size='11.5' fill='#2e7d32' font-weight="bold" text-anchor='middle'>BME280 en la garita</text><text x='690.0' y='201.0' font-size='9.5' fill='#5f6b78' text-anchor='middle'>cable apantallado 4 hilos ≤ 5 m, PG7 «WX»</text><line x1='360' y1='196' x2='560' y2='190' stroke='#2e7d32' stroke-width='1.8'/><text x='450' y='182' font-size='10' fill='#2e7d32' text-anchor='middle'>VIN, SDA, SCL, GND</text><rect x='560' y='290' width='260' height='110' rx='6' fill='#f7f9fb' stroke='#1565c0' stroke-width='1.8'/><text x='690.0' y='341.0' font-size='11.5' fill='#1565c0' font-weight="bold" text-anchor='middle'>Pluviómetro (reed)</text><text x='690.0' y='356.0' font-size='9.5' fill='#5f6b78' text-anchor='middle'>Misol WH-SP-RG · 0,2794 mm/vuelco</text><line x1='360' y1='326' x2='560' y2='330' stroke='#1565c0' stroke-width='1.8'/><line x1='360' y1='356' x2='560' y2='370' stroke='#37474f' stroke-width='1.8'/><text x='450' y='318' font-size='10' fill='#1565c0' text-anchor='middle'>GPIO17 · pull-up 10 kΩ + 100 nF a GND</text><rect x='560' y='430' width='260' height='110' rx='6' fill='#f7f9fb' stroke='#ef6c00' stroke-width='1.8'/><text x='690.0' y='481.0' font-size='11.5' fill='#ef6c00' font-weight="bold" text-anchor='middle'>Adaptador USB-RS485</text><text x='690.0' y='496.0' font-size='9.5' fill='#5f6b78' text-anchor='middle'>CH340 → /dev/rs485 (udev)</text><line x1='360' y1='446' x2='560' y2='480' stroke='#ef6c00' stroke-width='1.8'/><rect x='980' y='380' width='300' height='90' rx='6' fill='#f7f9fb' stroke='#00695c' stroke-width='1.8'/><text x='1130.0' y='421.0' font-size='11.5' fill='#00695c' font-weight="bold" text-anchor='middle'>Anemómetro RS485</text><text x='1130.0' y='436.0' font-size='9.5' fill='#5f6b78' text-anchor='middle'>Modbus dirección 1 · 4800 8N1</text><rect x='980' y='500' width='300' height='90' rx='6' fill='#f7f9fb' stroke='#00695c' stroke-width='1.8'/><text x='1130.0' y='541.0' font-size='11.5' fill='#00695c' font-weight="bold" text-anchor='middle'>Veleta RS485</text><text x='1130.0' y='556.0' font-size='9.5' fill='#5f6b78' text-anchor='middle'>Modbus dirección 2 · 0–7 × 45°</text><line x1='820' y1='485' x2='980' y2='425' stroke='#ef6c00' stroke-width='1.6'/><line x1='820' y1='485' x2='980' y2='545' stroke='#ef6c00' stroke-width='1.6'/><text x='830' y='470' font-size='10' fill='#ef6c00' text-anchor='start'>A+ amarillo · B− azul · GND negro</text><rect x='980' y='620' width='300' height='80' rx='6' fill='#fdecea' stroke='#c62828' stroke-width='1.8'/><text x='1130.0' y='656.0' font-size='11.5' fill='#c62828' font-weight="bold" text-anchor='middle'>Bus 12 V (WAGO) · fusible 1 A</text><text x='1130.0' y='671.0' font-size='9.5' fill='#5f6b78' text-anchor='middle'>alimenta los sensores de viento (10–30 V)</text><line x1='1130' y1='620' x2='1130' y2='590' stroke='#c62828' stroke-width='2'/><text x='1145' y='610' font-size='10' fill='#c62828' text-anchor='start'>marrón +12 V · negro GND</text><text x='40' y='720' font-size='11.2' fill='#1d2733' text-anchor='start'>• Un solo cable de 4 hilos (PG7 «VIENTO») lleva +12 V, GND, A y B a los dos sensores, conectados en paralelo (bus RS485).</text><text x='40' y='744' font-size='11.2' fill='#1d2733' text-anchor='start'>• La veleta sale de fábrica con la dirección 1, igual que el anemómetro: cámbiala a 2 antes de instalarla (manual 19).</text><text x='40' y='768' font-size='11.2' fill='#1d2733' text-anchor='start'>• El pluviómetro solo cierra un contacto: dos hilos al PG7 «LLUVIA». El condensador de 100 nF y el antirrebote de 20 ms evitan dobles cuentas.</text><text x='40' y='792' font-size='11.2' fill='#1d2733' text-anchor='start'>• bricohams-wx publica en APRS-IS (EA5KAO-13): dirección, velocidad media de 1 min, racha de 5 min, lluvia de 1 h, 24 h y desde medianoche.</text><text x='40' y='816' font-size='11.2' fill='#1d2733' text-anchor='start'>• Alternativa: los mismos sensores en un 3.er LilyGO con el firmware LoRa_APRS_Wx_Station de CA2RXU (bricohams-lilygo wxstation): emite por LoRa a 433,775.</text></svg>