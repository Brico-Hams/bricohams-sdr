<svg xmlns='http://www.w3.org/2000/svg' width='1500' height='900' viewBox='0 0 1500 900' font-family='DejaVu Sans, Arial, sans-serif'><rect width='1500' height='900' fill='#ffffff'/><text x='24' y='36' font-size='22' font-weight='bold' fill='#1d2733'>OpenWebRX+ en Docker desde bricohams.env (v4.3)</text><text x='24' y='58' font-size='12' fill='#5f6b78'>BricoHams SDR · EA5KAO · Mi QTH (Región de Murcia) · generado por tools/esquemas.py</text><rect x='0' y='892' width='1500' height='8' fill='#F26B21'/><rect x='0' y='890' width='1500' height='2' fill='#A6192E'/><defs><marker id='a00695c' markerWidth='10' markerHeight='8' refX='9' refY='4' orient='auto'><path d='M0,0 L10,4 L0,8 z' fill='#00695c'/></marker><marker id='a1565c0' markerWidth='10' markerHeight='8' refX='9' refY='4' orient='auto'><path d='M0,0 L10,4 L0,8 z' fill='#1565c0'/></marker><marker id='a1d2733' markerWidth='10' markerHeight='8' refX='9' refY='4' orient='auto'><path d='M0,0 L10,4 L0,8 z' fill='#1d2733'/></marker><marker id='a2e7d32' markerWidth='10' markerHeight='8' refX='9' refY='4' orient='auto'><path d='M0,0 L10,4 L0,8 z' fill='#2e7d32'/></marker><marker id='aA6192E' markerWidth='10' markerHeight='8' refX='9' refY='4' orient='auto'><path d='M0,0 L10,4 L0,8 z' fill='#A6192E'/></marker><marker id='aF26B21' markerWidth='10' markerHeight='8' refX='9' refY='4' orient='auto'><path d='M0,0 L10,4 L0,8 z' fill='#F26B21'/></marker></defs><rect x='30' y='90' width='360' height='300' rx='6' fill='#fff3e0' stroke='#F26B21' stroke-width='1.8'/><text x='210.0' y='110' font-size='11.5' fill='#F26B21' font-weight="bold" text-anchor='middle'>bricohams.env</text><text x='45' y='140' font-size='10.8' fill='#1d2733' text-anchor='start'>OWRX_BACKEND="docker"</text><text x='45' y='172' font-size='10.8' fill='#1d2733' text-anchor='start'>OWRX_DOCKER_IMAGE=slechev/openwebrxplus-softmbe</text><text x='45' y='204' font-size='10.8' fill='#1d2733' text-anchor='start'>OWRX_DOCKER_CONTAINER="owrx-mbe"</text><text x='45' y='236' font-size='10.8' fill='#1d2733' text-anchor='start'>OWRX_DOCKER_DIR="/opt/owrx-docker"</text><text x='45' y='268' font-size='10.8' fill='#1d2733' text-anchor='start'>OWRX_DOCKER_RED="host" (o bridge + PORT)</text><text x='45' y='300' font-size='10.8' fill='#1d2733' text-anchor='start'>OWRX_DOCKER_PRIVILEGED="no"</text><text x='45' y='332' font-size='10.8' fill='#1d2733' text-anchor='start'>OWRX_DOCKER_DESPLEGAR / _ACTUALIZAR="yes"</text><line x1='390' y1='240' x2='480' y2='240' stroke='#1d2733' stroke-width='2' marker-end='url(#a1d2733)'/><text x='435' y='228' font-size='10' fill='#1d2733' text-anchor='middle'>paso</text><rect x='480' y='90' width='470' height='300' rx='6' fill='#eef4fb' stroke='#1565c0' stroke-width='1.8'/><text x='715.0' y='110' font-size='11.5' fill='#1565c0' font-weight="bold" text-anchor='middle'>install.sh → docker_preparar</text><text x='495' y='140' font-size='10.8' fill='#1d2733' text-anchor='start'>1 docker.io + docker compose si faltan</text><text x='495' y='172' font-size='10.8' fill='#1d2733' text-anchor='start'>2 para y desactiva el OpenWebRX+ nativo</text><text x='495' y='204' font-size='10.8' fill='#1d2733' text-anchor='start'>3 usuario openwebrx del sistema (servicios)</text><text x='495' y='236' font-size='10.8' fill='#1d2733' text-anchor='start'>4 /opt/owrx-docker/{etc,var,plugins}</text><text x='495' y='268' font-size='10.8' fill='#1d2733' text-anchor='start'>5 docker-compose.yaml (bricohams-docker-compose.py)</text><text x='495' y='300' font-size='10.8' fill='#1d2733' text-anchor='start'>6 docker compose pull · up -d</text><text x='495' y='332' font-size='10.8' fill='#1d2733' text-anchor='start'>7 espera /status.json · comprueba los volúmenes</text><line x1='950' y1='240' x2='1040' y2='240' stroke='#1d2733' stroke-width='2' marker-end='url(#a1d2733)'/><rect x='1040' y='90' width='430' height='420' rx='6' fill='#e0f2f1' stroke='#00695c' stroke-width='1.8'/><text x='1255.0' y='110' font-size='11.5' fill='#00695c' font-weight="bold" text-anchor='middle'>Contenedor owrx-mbe</text><text x='1255.0' y='126' font-size='9.5' fill='#5f6b78' text-anchor='middle'>red host · restart unless-stopped</text><text x='1055' y='165' font-size='11' fill='#1565c0' font-weight="bold" text-anchor='start'>./etc</text><text x='1175' y='165' font-size='10.8' fill='#1d2733' text-anchor='start'>→ /etc/openwebrx</text><text x='1055' y='199' font-size='11' fill='#1565c0' font-weight="bold" text-anchor='start'>./var</text><text x='1175' y='199' font-size='10.8' fill='#1d2733' text-anchor='start'>→ /var/lib/openwebrx</text><text x='1055' y='233' font-size='11' fill='#1565c0' font-weight="bold" text-anchor='start'>./plugins</text><text x='1175' y='233' font-size='10.8' fill='#1d2733' text-anchor='start'>→ …/htdocs/plugins</text><text x='1055' y='267' font-size='11' fill='#1565c0' font-weight="bold" text-anchor='start'>/dev/bus/usb</text><text x='1175' y='267' font-size='10.8' fill='#1d2733' text-anchor='start'>→ /dev/bus/usb (c 189:* rmw)</text><text x='1055' y='330' font-size='10.8' fill='#1d2733' text-anchor='start'>• OpenWebRX+ corre como root dentro</text><text x='1055' y='360' font-size='10.8' fill='#1d2733' text-anchor='start'>• SDRplay y codecs (softmbe) en la imagen</text><text x='1055' y='390' font-size='10.8' fill='#1d2733' text-anchor='start'>• :8073 en la Pi (red host)</text><text x='1055' y='420' font-size='10.8' fill='#1d2733' text-anchor='start'>• MQTT a 127.0.0.1:1883 (visitas)</text><rect x='30' y='440' width='920' height='250' rx='6' fill='#edf7ee' stroke='#2e7d32' stroke-width='1.8'/><text x='490.0' y='460' font-size='11.5' fill='#2e7d32' font-weight="bold" text-anchor='middle'>Lo demás de BricoHams sigue en la Pi (sin cambios)</text><text x='45' y='495' font-size='10.8' fill='#1d2733' text-anchor='start'>• configuracion · plugins · meteo · cámara · visitas · satélites escriben en /opt/owrx-docker/{var,plugins}</text><text x='45' y='525' font-size='10.8' fill='#1d2733' text-anchor='start'>•  (HTDOCS=/opt/owrx-docker, OWRX_DATA=…/var: install.sh las guarda en /etc/bricohams/bricohams.env)</text><text x='45' y='555' font-size='10.8' fill='#1d2733' text-anchor='start'>• se reinicia el contenedor (docker restart) en vez de systemctl restart openwebrx</text><text x='45' y='585' font-size='10.8' fill='#1d2733' text-anchor='start'>• nginx, SSL, ADS-B, Meshtastic, LilyGO, WX: igual que en la instalación nativa</text><text x='45' y='615' font-size='10.8' fill='#1d2733' text-anchor='start'>• no aplican en Docker: FT2 (parche del código) · API de SDRplay en el host · repositorio luarvique</text><text x='45' y='645' font-size='10.8' fill='#1d2733' text-anchor='start'>• copia diaria: /opt/owrx-docker y un perfil owrx-clone --docker · tarea actualizar: compose pull + up</text><rect x='1040' y='550' width='430' height='270' rx='6' fill='#fdecee' stroke='#A6192E' stroke-width='1.8'/><text x='1255.0' y='570' font-size='11.5' fill='#A6192E' font-weight="bold" text-anchor='middle'>owrx-clone 1.1 --docker owrx-mbe</text><text x='1055' y='600' font-size='10.8' fill='#1d2733' text-anchor='start'>• volúmenes por docker inspect</text><text x='1055' y='632' font-size='10.8' fill='#1d2733' text-anchor='start'>• config → ./var · etc → ./etc · web → ./plugins</text><text x='1055' y='664' font-size='10.8' fill='#1d2733' text-anchor='start'>• sin apt (la imagen) ni parches</text><text x='1055' y='696' font-size='10.8' fill='#1d2733' text-anchor='start'>• nativo → Docker y Docker → nativo</text><text x='1055' y='728' font-size='10.8' fill='#1d2733' text-anchor='start'>• deshacer: docker stop / start</text><text x='1055' y='760' font-size='10.8' fill='#1d2733' text-anchor='start'>• sin volumen de /etc o /var: se para</text><rect x='30' y='720' width='920' height='100' rx='6' fill='#fafafa' stroke='#1d2733' stroke-width='1.8'/><text x='490.0' y='740' font-size='11.5' fill='#1d2733' font-weight="bold" text-anchor='middle'>Pasar de nativo a Docker (manual 33)</text><text x='45' y='770' font-size='10.8' fill='#1d2733' text-anchor='start'>sudo owrx-clone exportar -o p.owrx.tar.gz → OWRX_BACKEND="docker" → sudo bash install.sh --actualizar</text><text x='45' y='795' font-size='10.8' fill='#1d2733' text-anchor='start'>→ sudo owrx-clone --docker owrx-mbe importar p.owrx.tar.gz</text><text x='30' y='860' font-size='11' fill='#5f6b78' text-anchor='start'>Imagen oficial de OpenWebRX+ en Docker Hub: slechev/openwebrxplus (y -softmbe). Manual 33 · ADR-44 y ADR-45.</text></svg>