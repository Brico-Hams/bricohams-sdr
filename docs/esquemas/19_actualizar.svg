<svg xmlns='http://www.w3.org/2000/svg' width='1500' height='930' viewBox='0 0 1500 930' font-family='DejaVu Sans, Arial, sans-serif'><rect width='1500' height='930' fill='#ffffff'/><text x='24' y='36' font-size='22' font-weight='bold' fill='#1d2733'>Actualizar la estación: install.sh --actualizar</text><text x='24' y='58' font-size='12' fill='#5f6b78'>BricoHams SDR · EA5KAO · Mi QTH (Región de Murcia) · generado por tools/esquemas.py</text><rect x='0' y='922' width='1500' height='8' fill='#F26B21'/><rect x='0' y='920' width='1500' height='2' fill='#A6192E'/><defs><marker id='a1565c0' markerWidth='10' markerHeight='8' refX='9' refY='4' orient='auto'><path d='M0,0 L10,4 L0,8 z' fill='#1565c0'/></marker><marker id='a1d2733' markerWidth='10' markerHeight='8' refX='9' refY='4' orient='auto'><path d='M0,0 L10,4 L0,8 z' fill='#1d2733'/></marker><marker id='a2e7d32' markerWidth='10' markerHeight='8' refX='9' refY='4' orient='auto'><path d='M0,0 L10,4 L0,8 z' fill='#2e7d32'/></marker><marker id='aA6192E' markerWidth='10' markerHeight='8' refX='9' refY='4' orient='auto'><path d='M0,0 L10,4 L0,8 z' fill='#A6192E'/></marker><marker id='aF26B21' markerWidth='10' markerHeight='8' refX='9' refY='4' orient='auto'><path d='M0,0 L10,4 L0,8 z' fill='#F26B21'/></marker></defs><rect x='40' y='90' width='430' height='82' rx='6' fill='#eef4fb' stroke='#1565c0' stroke-width='1.8'/><text x='255.0' y='110' font-size='11.5' fill='#1565c0' font-weight="bold" text-anchor='middle'>1 · Kit (git)</text><text x='255' y='142' font-size='10.5' fill='#1d2733' text-anchor='middle'>git pull --ff-only como el dueño del kit</text><text x='255' y='160' font-size='10' fill='#5f6b78' text-anchor='middle'>install.sh nuevo → se relanza (--continuar)</text><line x1='255' y1='172' x2='255' y2='200' stroke='#1d2733' stroke-width='2' marker-end='url(#a1d2733)'/><rect x='40' y='200' width='430' height='82' rx='6' fill='#fff3e0' stroke='#F26B21' stroke-width='1.8'/><text x='255.0' y='220' font-size='11.5' fill='#F26B21' font-weight="bold" text-anchor='middle'>2 · bricohams.env</text><text x='255' y='252' font-size='10.5' fill='#1d2733' text-anchor='middle'>añade las variables nuevas del .example</text><text x='255' y='270' font-size='10' fill='#5f6b78' text-anchor='middle'>nunca cambia las tuyas ni tus claves</text><line x1='255' y1='282' x2='255' y2='310' stroke='#1d2733' stroke-width='2' marker-end='url(#a1d2733)'/><rect x='40' y='310' width='430' height='82' rx='6' fill='#edf7ee' stroke='#2e7d32' stroke-width='1.8'/><text x='255.0' y='330' font-size='11.5' fill='#2e7d32' font-weight="bold" text-anchor='middle'>3 · Copia</text><text x='255' y='362' font-size='10.5' fill='#1d2733' text-anchor='middle'>bricohams-backup → /var/backups/bricohams</text><text x='255' y='380' font-size='10' fill='#5f6b78' text-anchor='middle'>si falla, no sigue</text><line x1='255' y1='392' x2='255' y2='420' stroke='#1d2733' stroke-width='2' marker-end='url(#a1d2733)'/><rect x='40' y='420' width='430' height='82' rx='6' fill='#eceff1' stroke='#455a64' stroke-width='1.8'/><text x='255.0' y='440' font-size='11.5' fill='#455a64' font-weight="bold" text-anchor='middle'>4 · Sistema (apt)</text><text x='255' y='472' font-size='10.5' fill='#1d2733' text-anchor='middle'>apt update (IPv4 si hace falta) + upgrade</text><text x='255' y='490' font-size='10' fill='#5f6b78' text-anchor='middle'>respeta lo retenido y tus .conf</text><line x1='255' y1='502' x2='255' y2='530' stroke='#1d2733' stroke-width='2' marker-end='url(#a1d2733)'/><rect x='40' y='530' width='430' height='82' rx='6' fill='#fdecee' stroke='#A6192E' stroke-width='1.8'/><text x='255.0' y='550' font-size='11.5' fill='#A6192E' font-weight="bold" text-anchor='middle'>5 · Plan de pasos</text><text x='255' y='582' font-size='10.5' fill='#1d2733' text-anchor='middle'>huella actual ≠ huella guardada ?</text><text x='255' y='600' font-size='10' fill='#5f6b78' text-anchor='middle'>solo esos pasos + comprobar + herramientas</text><line x1='255' y1='612' x2='255' y2='640' stroke='#1d2733' stroke-width='2' marker-end='url(#a1d2733)'/><rect x='40' y='640' width='430' height='82' rx='6' fill='#f7f9fb' stroke='#1d2733' stroke-width='1.8'/><text x='255.0' y='660' font-size='11.5' fill='#1d2733' font-weight="bold" text-anchor='middle'>6 · Pasos</text><text x='255' y='692' font-size='10.5' fill='#1d2733' text-anchor='middle'>paso_x … y guarda su huella</text><text x='255' y='710' font-size='10' fill='#5f6b78' text-anchor='middle'>si se corta, se relanza y sigue</text><line x1='255' y1='722' x2='255' y2='750' stroke='#1d2733' stroke-width='2' marker-end='url(#a1d2733)'/><rect x='40' y='750' width='430' height='82' rx='6' fill='#edf7ee' stroke='#2e7d32' stroke-width='1.8'/><text x='255.0' y='770' font-size='11.5' fill='#2e7d32' font-weight="bold" text-anchor='middle'>7 · Final</text><text x='255' y='802' font-size='10.5' fill='#1d2733' text-anchor='middle'>bricohams-check · Telegram</text><text x='255' y='820' font-size='10' fill='#5f6b78' text-anchor='middle'>actualizaciones.log · ¿reiniciar?</text><rect x='560' y='90' width='900' height='300' rx='6' fill='#fff' stroke='#A6192E' stroke-width='1.8'/><text x='1010.0' y='110' font-size='11.5' fill='#A6192E' font-weight="bold" text-anchor='middle'>Huella de cada paso · /var/lib/bricohams/kit-estado (600, sin valores)</text><text x='590' y='150' font-size='11' fill='#5f6b78' font-weight="bold" text-anchor='start'>huella</text><text x='700' y='150' font-size='11' fill='#5f6b78' font-weight="bold" text-anchor='start'>cómo se calcula</text><text x='1060' y='150' font-size='11' fill='#5f6b78' font-weight="bold" text-anchor='start'>cuándo cambia</text><text x='1280' y='150' font-size='11' fill='#5f6b78' font-weight="bold" text-anchor='start'>ejemplo</text><line x1='580' y1='163' x2='1440' y2='163' stroke='#9aa6b2' stroke-width='1'/><text x='590' y='185' font-size='11.5' fill='#A6192E' font-weight="bold" text-anchor='start'>código</text><text x='700' y='185' font-size='10.5' fill='#1d2733' text-anchor='start'>declare -f paso_x | sha256</text><text x='1060' y='185' font-size='10.5' fill='#1d2733' text-anchor='start'>cambia el paso en install.sh</text><text x='1280' y='185' font-size='10.5' fill='#1d2733' text-anchor='start'>web → solo web</text><line x1='580' y1='215' x2='1440' y2='215' stroke='#9aa6b2' stroke-width='1'/><text x='590' y='237' font-size='11.5' fill='#A6192E' font-weight="bold" text-anchor='start'>ficheros</text><text x='700' y='237' font-size='10.5' fill='#1d2733' text-anchor='start'>sha256 de los $FILES/… y $KIT/… que usa</text><text x='1060' y='237' font-size='10.5' fill='#1d2733' text-anchor='start'>plugin nuevo, firmware, plantilla…</text><text x='1280' y='237' font-size='10.5' fill='#1d2733' text-anchor='start'>htdocs/plugins → plugins</text><line x1='580' y1='267' x2='1440' y2='267' stroke='#9aa6b2' stroke-width='1'/><text x='590' y='289' font-size='11.5' fill='#A6192E' font-weight="bold" text-anchor='start'>variables</text><text x='700' y='289' font-size='10.5' fill='#1d2733' text-anchor='start'>NOMBRE=valor de las que lee (configuracion: todas)</text><text x='1060' y='289' font-size='10.5' fill='#1d2733' text-anchor='start'>cambias bricohams.env</text><text x='1280' y='289' font-size='10.5' fill='#1d2733' text-anchor='start'>WX_APRS_COMMENT → sensor</text><text x='590' y='355' font-size='10.5' fill='#5f6b78' text-anchor='start'>Sin huellas (estación anterior a la v4.1): se aplican todos los pasos, igual que una instalación, sin perder nada.</text><line x1='560' y1='240' x2='515' y2='240' stroke='#A6192E' stroke-width='1.5' stroke-dasharray='6 4'/><line x1='515' y1='240' x2='515' y2='570' stroke='#A6192E' stroke-width='1.5' stroke-dasharray='6 4'/><line x1='515' y1='570' x2='472' y2='570' stroke='#A6192E' stroke-width='1.5' stroke-dasharray='6 4' marker-end='url(#aA6192E)'/><text x='522' y='410' font-size='10.5' fill='#A6192E' text-anchor='start'>compara</text><rect x='560' y='440' width='900' height='230' rx='6' fill='#fff' stroke='#F26B21' stroke-width='1.8'/><text x='1010.0' y='460' font-size='11.5' fill='#F26B21' font-weight="bold" text-anchor='middle'>Marcadores en tres vías (paso configuracion)</text><rect x='600' y='500' width='230' height='60' rx='6' fill='#f7f9fb' stroke='#5f6b78' stroke-width='1.8'/><text x='715.0' y='526.0' font-size='11.5' fill='#5f6b78' font-weight="bold" text-anchor='middle'>kit anterior</text><text x='715.0' y='541.0' font-size='9.5' fill='#5f6b78' text-anchor='middle'>bookmarks.kit.json</text><rect x='890' y='500' width='230' height='60' rx='6' fill='#f7f9fb' stroke='#1d2733' stroke-width='1.8'/><text x='1005.0' y='526.0' font-size='11.5' fill='#1d2733' font-weight="bold" text-anchor='middle'>actuales (web)</text><text x='1005.0' y='541.0' font-size='9.5' fill='#5f6b78' text-anchor='middle'>/var/lib/openwebrx/bookmarks.json</text><rect x='1180' y='500' width='230' height='60' rx='6' fill='#f7f9fb' stroke='#1565c0' stroke-width='1.8'/><text x='1295.0' y='526.0' font-size='11.5' fill='#1565c0' font-weight="bold" text-anchor='middle'>kit nuevo</text><text x='1295.0' y='541.0' font-size='9.5' fill='#5f6b78' text-anchor='middle'>files/openwebrx/bookmarks.json</text><text x='1010' y='600' font-size='11' fill='#1d2733' font-weight="bold" text-anchor='middle'>resultado = kit nuevo (gana) + propios (actuales que no venían en el kit anterior)</text><text x='1010' y='625' font-size='10.5' fill='#5f6b78' text-anchor='middle'>clave: frecuencia + modo · copia previa bookmarks.json.antes-FECHA</text><rect x='560' y='710' width='900' height='160' rx='6' fill='#edf7ee' stroke='#2e7d32' stroke-width='1.8'/><text x='1010.0' y='730' font-size='11.5' fill='#2e7d32' font-weight="bold" text-anchor='middle'>Órdenes</text><text x='590' y='765' font-size='11' fill='#1d2733' text-anchor='start'>sudo bash install.sh --actualizar --simular → ver qué haría, sin cambiar nada</text><text x='590' y='789' font-size='11' fill='#1d2733' text-anchor='start'>sudo bash install.sh --actualizar → actualizar</text><text x='590' y='813' font-size='11' fill='#1d2733' text-anchor='start'>opciones: --sin-git (kit copiado del zip) · --sin-apt · --todo (repite todos los pasos)</text><text x='590' y='837' font-size='11' fill='#1d2733' text-anchor='start'>El cron semanal solo hace apt: bajar código y ejecutarlo como root, a mano (ADR-37).</text></svg>