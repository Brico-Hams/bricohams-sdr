<svg xmlns='http://www.w3.org/2000/svg' width='1500' height='900' viewBox='0 0 1500 900' font-family='DejaVu Sans, Arial, sans-serif'><rect width='1500' height='900' fill='#ffffff'/><text x='24' y='36' font-size='22' font-weight='bold' fill='#1d2733'>Zona de la estación por locator: aeropuertos, AEMET, puertos y FM (v4.3)</text><text x='24' y='58' font-size='12' fill='#5f6b78'>BricoHams SDR · EA5KAO · Mi QTH (Región de Murcia) · generado por tools/esquemas.py</text><rect x='0' y='892' width='1500' height='8' fill='#F26B21'/><rect x='0' y='890' width='1500' height='2' fill='#A6192E'/><defs><marker id='a00695c' markerWidth='10' markerHeight='8' refX='9' refY='4' orient='auto'><path d='M0,0 L10,4 L0,8 z' fill='#00695c'/></marker><marker id='a1565c0' markerWidth='10' markerHeight='8' refX='9' refY='4' orient='auto'><path d='M0,0 L10,4 L0,8 z' fill='#1565c0'/></marker><marker id='a1d2733' markerWidth='10' markerHeight='8' refX='9' refY='4' orient='auto'><path d='M0,0 L10,4 L0,8 z' fill='#1d2733'/></marker><marker id='a2e7d32' markerWidth='10' markerHeight='8' refX='9' refY='4' orient='auto'><path d='M0,0 L10,4 L0,8 z' fill='#2e7d32'/></marker><marker id='a6a1b9a' markerWidth='10' markerHeight='8' refX='9' refY='4' orient='auto'><path d='M0,0 L10,4 L0,8 z' fill='#6a1b9a'/></marker><marker id='aA6192E' markerWidth='10' markerHeight='8' refX='9' refY='4' orient='auto'><path d='M0,0 L10,4 L0,8 z' fill='#A6192E'/></marker><marker id='aF26B21' markerWidth='10' markerHeight='8' refX='9' refY='4' orient='auto'><path d='M0,0 L10,4 L0,8 z' fill='#F26B21'/></marker></defs><rect x='30' y='90' width='330' height='250' rx='6' fill='#fff3e0' stroke='#F26B21' stroke-width='1.8'/><text x='195.0' y='110' font-size='11.5' fill='#F26B21' font-weight="bold" text-anchor='middle'>bricohams.env</text><text x='45' y='140' font-size='10.8' fill='#1d2733' text-anchor='start'>STATION_LOCATOR="IM97kx"</text><text x='45' y='166' font-size='10.8' fill='#1d2733' text-anchor='start'>STATION_LAT / STATION_LON (si están, mandan)</text><text x='45' y='192' font-size='10.8' fill='#1d2733' text-anchor='start'>LOCATOR_CATALOG=data/locator/catalogo_es.json</text><text x='45' y='218' font-size='10.8' fill='#1d2733' text-anchor='start'>LOCATOR_RADIUS_KM=100 · LOCATOR_MAX_SITES=3</text><text x='45' y='244' font-size='10.8' fill='#1d2733' text-anchor='start'>LOCATOR_ONLINE=aemet,fmdx</text><text x='45' y='270' font-size='10.8' fill='#1d2733' text-anchor='start'>LOCATOR_RADIOS=regional,local (MAX 30)</text><text x='45' y='296' font-size='10.8' fill='#1d2733' text-anchor='start'>LOCATOR_METEO=yes · LOCATOR_KIT_ZONA_KM=150</text><rect x='30' y='380' width='330' height='300' rx='6' fill='#edf7ee' stroke='#2e7d32' stroke-width='1.8'/><text x='195.0' y='400' font-size='11.5' fill='#2e7d32' font-weight="bold" text-anchor='middle'>Catálogo de España (en el kit)</text><text x='195.0' y='416' font-size='9.5' fill='#5f6b78' text-anchor='middle'>tools/locator_catalogo.py</text><text x='45' y='440' font-size='10.8' fill='#1d2733' text-anchor='start'>aeropuertos: OurAirports (dominio público)</text><text x='45' y='470' font-size='10.8' fill='#1d2733' text-anchor='start'>frecuencias; 8,33 kHz → frecuencia real</text><text x='45' y='500' font-size='10.8' fill='#1d2733' text-anchor='start'>estaciones AEMET: 150 indicativos</text><text x='45' y='530' font-size='10.8' fill='#1d2733' text-anchor='start'>puertos: interés general + deportivos</text><text x='45' y='560' font-size='10.8' fill='#1d2733' text-anchor='start'>canales 9 / 12 / 14 / 16</text><text x='45' y='590' font-size='10.8' fill='#1d2733' text-anchor='start'>NAVTEX 518 y 490 kHz (alcance 550 km)</text><rect x='30' y='710' width='330' height='110' rx='6' fill='#e0f2f1' stroke='#00695c' stroke-width='1.8'/><text x='195.0' y='730' font-size='11.5' fill='#00695c' font-weight="bold" text-anchor='middle'>En la Pi, al instalar (caché 30 días)</text><text x='45' y='760' font-size='10.8' fill='#1d2733' text-anchor='start'>AEMET OpenData: todas las estaciones</text><text x='45' y='784' font-size='10.8' fill='#1d2733' text-anchor='start'>maps.fmdx.org (FMLIST): FM de la zona</text><line x1='360' y1='215' x2='470' y2='330' stroke='#1d2733' stroke-width='2' marker-end='url(#a1d2733)'/><line x1='360' y1='530' x2='470' y2='410' stroke='#1d2733' stroke-width='2' marker-end='url(#a1d2733)'/><line x1='360' y1='765' x2='470' y2='450' stroke='#00695c' stroke-width='2' stroke-dasharray='6 4' marker-end='url(#a00695c)'/><rect x='470' y='230' width='470' height='330' rx='6' fill='#eef4fb' stroke='#1565c0' stroke-width='1.8'/><text x='705.0' y='250' font-size='11.5' fill='#1565c0' font-weight="bold" text-anchor='middle'>bricohams_locator_bookmarks.py</text><text x='705.0' y='266' font-size='9.5' fill='#5f6b78' text-anchor='middle'>paso «configuracion» · bricohams-locator</text><text x='490' y='290' font-size='10.8' fill='#1d2733' text-anchor='start'>1 locator → coordenadas (o las exactas del env)</text><text x='490' y='318' font-size='10.8' fill='#1d2733' text-anchor='start'>2 distancia a cada sitio del catálogo</text><text x='490' y='346' font-size='10.8' fill='#1d2733' text-anchor='start'>3 los 3 más cercanos de cada categoría en 100 km</text><text x='490' y='374' font-size='10.8' fill='#1d2733' text-anchor='start'>(aeropuerto y AEMET: al menos uno, hasta 250 km)</text><text x='490' y='402' font-size='10.8' fill='#1d2733' text-anchor='start'>4 FM: regionales y locales que mejor se oyen</text><text x='490' y='430' font-size='10.8' fill='#1d2733' text-anchor='start'>(potencia / distancia², una por frecuencia)</text><text x='490' y='458' font-size='10.8' fill='#1d2733' text-anchor='start'>5 canales repetidos juntos: Canal 16 · A / B</text><text x='490' y='486' font-size='10.8' fill='#1d2733' text-anchor='start'>6 etiqueta [AUTO-LOCATOR] y distancia en km</text><text x='490' y='514' font-size='10.8' fill='#1d2733' text-anchor='start'>7 lejos de Mi QTH: fuera los del kit de Murcia</text><line x1='940' y1='330' x2='1060' y2='200' stroke='#1d2733' stroke-width='2' marker-end='url(#a1d2733)'/><text x='950' y='245' font-size='10.5' fill='#1d2733' text-anchor='start'>marcadores</text><line x1='940' y1='420' x2='1060' y2='470' stroke='#1d2733' stroke-width='2' marker-end='url(#a1d2733)'/><text x='948' y='425' font-size='10.5' fill='#1d2733' text-anchor='start'>METEO</text><line x1='940' y1='500' x2='1060' y2='700' stroke='#1d2733' stroke-width='2' marker-end='url(#a1d2733)'/><text x='1000' y='570' font-size='10.5' fill='#1d2733' text-anchor='start'>informe</text><rect x='1060' y='90' width='410' height='270' rx='6' fill='#f3e5f5' stroke='#6a1b9a' stroke-width='1.8'/><text x='1265.0' y='110' font-size='11.5' fill='#6a1b9a' font-weight="bold" text-anchor='middle'>OpenWebRX+ · bookmarks.json</text><text x='1075' y='140' font-size='10.8' fill='#1d2733' text-anchor='start'>los tuyos: nunca se tocan</text><text x='1075' y='174' font-size='10.8' fill='#1d2733' text-anchor='start'>los del kit: se quedan (en la zona de Murcia)</text><text x='1075' y='208' font-size='10.8' fill='#1d2733' text-anchor='start'>o se adaptan (lejos: Canal 12 · Cartagena → Canal 12)</text><text x='1075' y='242' font-size='10.8' fill='#1d2733' text-anchor='start'>[AUTO-LOCATOR]: se sustituyen en cada pasada</text><text x='1075' y='276' font-size='10.8' fill='#1d2733' text-anchor='start'>(misma frecuencia que uno tuyo: gana el tuyo)</text><text x='1075' y='310' font-size='10.8' fill='#1d2733' text-anchor='start'>sudo bricohams-locator marcadores --aplicar</text><rect x='1060' y='400' width='410' height='170' rx='6' fill='#edf7ee' stroke='#2e7d32' stroke-width='1.8'/><text x='1265.0' y='420' font-size='11.5' fill='#2e7d32' font-weight="bold" text-anchor='middle'>Meteo (bricohams-meteo)</text><text x='1075' y='450' font-size='10.8' fill='#1d2733' text-anchor='start'>meteo.env: METEO_STATIONS de la zona</text><text x='1075' y='480' font-size='10.8' fill='#1d2733' text-anchor='start'>LOCATOR_METEO="no" conserva la tuya</text><text x='1075' y='510' font-size='10.8' fill='#1d2733' text-anchor='start'>plugin METEO de la web: tiempo real AEMET</text><rect x='1060' y='610' width='410' height='210' rx='6' fill='#fafafa' stroke='#1d2733' stroke-width='1.8'/><text x='1265.0' y='630' font-size='11.5' fill='#1d2733' font-weight="bold" text-anchor='middle'>bricohams-locator info</text><text x='1075' y='660' font-size='10.8' fill='#1d2733' text-anchor='start'>QTH IM97kx · 38.08, -1.25 · península</text><text x='1075' y='688' font-size='10.8' fill='#1d2733' text-anchor='start'>aeropuertos, AEMET, puertos, FM y NAVTEX</text><text x='1075' y='716' font-size='10.8' fill='#1d2733' text-anchor='start'>con su distancia</text><text x='1075' y='744' font-size='10.8' fill='#1d2733' text-anchor='start'>refrescar · meteo · coordenadas · locator</text><text x='1075' y='772' font-size='10.8' fill='#1d2733' text-anchor='start'>bricohams-check: «zona … N marcadores»</text><text x='30' y='860' font-size='11' fill='#5f6b78' text-anchor='start'>Vale para cualquier locator de España: IN, IM, JN, JM (península y Baleares), IL (Canarias), IM75 (Ceuta) e IM85 (Melilla). Fuera de España avisa. Manual 32 · ADR-43.</text></svg>