<text x="28" y="34" fill="white" font-size="24" font-weight="bold">BricoHams SDR · Calibrar donde se conecta el DUT</text>
<text x="28" y="60" fill="#ffba82" font-size="16">Plano de referencia = extremo de cable + adaptadores presentes al medir</text>
<rect x="35" y="170" width="200" height="240" rx="14" fill="#1d2733"/>
<text x="65" y="215" font-size="25" fill="white">NanoVNA</text><text x="65" y="275" fill="#ffba82" font-size="20">Puerto 1</text><text x="65" y="365" fill="#ffba82" font-size="20">Puerto 2</text>
<g fill="none" stroke-width="5"><path d="M235 268 H560" stroke="#1565c0"/><path d="M235 360 H1030 V268 H910" stroke="#00838f"/></g>
<text x="320" y="245" font-size="18" fill="#1565c0">Cable A</text><text x="450" y="395" font-size="18" fill="#00838f">Cable B</text>
<g stroke="#a6192e" stroke-width="3" stroke-dasharray="7 5"><path d="M560 145 V435"/><path d="M910 145 V435"/></g>
<text x="515" y="125" fill="#a6192e" font-size="21">Plano A</text><text x="865" y="125" fill="#a6192e" font-size="21">Plano B</text>
<rect x="590" y="210" width="290" height="105" rx="10" fill="#e6f0fa" stroke="#1565c0" stroke-width="2"/>
<path d="M560 268 H590" fill="none" stroke="#1565c0" stroke-width="5"/><path d="M880 268 H910" fill="none" stroke="#00838f" stroke-width="5"/>
<text x="615" y="251" fill="#1d2733" font-size="22">THRU al calibrar</text><text x="615" y="285" fill="#1d2733" font-size="22">DUT al medir S21</text>
<text x="320" y="465" fill="#1d2733" font-size="21">Para S11: OPEN, SHORT y LOAD se colocan uno a uno en A.</text>
<text x="320" y="503" fill="#1d2733" font-size="21">Después sustituir el patrón por la antena o DUT.</text>
<text x="35" y="560" fill="#a6192e" font-size="20">Cambiar cable o añadir adaptador después modifica el plano: corregir o recalibrar.</text>
<text x="35" y="615" fill="#455a64" font-size="15">BricoHams SDR · Sin RF externa ni DC · OSL + THRU básico no equivale a SOLT bidireccional completo</text>
<rect y="642" width="1200" height="8" fill="#f26b21"/>
</svg>
