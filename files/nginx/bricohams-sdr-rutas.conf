# =====================================================================
#  nginx · BricoHams SDR · rutas comunes a HTTP y HTTPS (v4.2)
#  Lo incluye /etc/nginx/sites-available/bricohams-sdr (paso «web» de install.sh).
#  /            OpenWebRX+ (127.0.0.1:8073, con websockets)
#  /tar1090/    mapa de aviones (lighttpd movido a 127.0.0.1:8504)
#  /camara/     vídeo HLS de MediaMTX (127.0.0.1:8888)
#  /bricohams/  portal de servicios, privacidad y API de los plugins
# =====================================================================
client_max_body_size 4m;
access_log /var/log/nginx/bricohams-sdr.access.log;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options SAMEORIGIN always;                         # v4.4 · nadie mete la web en un marco ajeno
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;

# v4.4 · /login y cambio de contraseña con límite de intentos (zona bh_login de la plantilla).
# Es una regex: en el HTTP de SSL_MODO=admin gana antes la redirección a HTTPS.
location ~ ^/(login|pwchange)$ {
    limit_req zone=bh_login burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8073;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
# v4.5 · los botones «Meshtastic 433 / 868» y «APRS (RAK)» de /settings los pone
# bricohams-owrx-botones en la plantilla de OpenWebRX+ (salen también entrando por :8073).
# Paneles SOLO con sesión de administrador de OpenWebRX+
# (bricohams-mesh-admin lo comprueba contra /settings). Prefijo sin ^~: en HTTP
# gana la redirección a HTTPS de /settings.
location /settings/bricohams/ {
    proxy_pass http://127.0.0.1:8076;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}
# ficheros ocultos (.git, .env…) nunca se sirven
location ~ /\.(?!well-known/) { return 404; }

location / {
    proxy_pass http://127.0.0.1:8073;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;    # OpenWebRX+ toma la IP del oyente de aquí
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1d;
    proxy_send_timeout 1d;
    proxy_buffering off;
}
location = /tar1090 { return 301 /tar1090/; }
location /tar1090/ {
    proxy_pass http://127.0.0.1:8504/tar1090/;
    proxy_set_header Host $host;
}
location /camara/ {
    proxy_pass http://127.0.0.1:8888/;
    proxy_set_header Host $host;
    proxy_buffering off;
}
location = /bricohams { return 301 /bricohams/; }
location /bricohams/api/ {
    proxy_pass http://127.0.0.1:8075;
    proxy_set_header X-Forwarded-For $remote_addr;
    limit_except GET { deny all; }
}
location /bricohams/ {
    alias /var/www/bricohams/;
    index index.html;
}
