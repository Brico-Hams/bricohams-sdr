# ficheros ocultos (.git, .env…) nunca se sirven
location ~ /\.(?!well-known/) { return 404; }

location / {
    proxy_pass http://127.0.0.1:8073;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;    # OpenWebRX+ toma la IP del oyente de aquí
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1d;
    proxy_send_timeout 1d;
    proxy_buffering off;
    # v5.0 · logo de BricoHams en la cabecera de TODAS las páginas (receptor, /map, /settings…):
    # nginx cambia el SVG de OpenWebRX+ por la imagen del plugin «marca» sin tocar el paquete.
    # OpenWebRX+ debe responder sin comprimir para que sub_filter pueda leer el HTML.
    proxy_set_header Accept-Encoding "";
    sub_filter_once on;
    sub_filter '<a href="https://www.openwebrx.de/" target="_blank"><svg viewBox="0 0 591 100" class="webrx-top-logo">' '<a href="/bricohams/" title="BricoHams"><img src="/static/plugins/receiver/marca/bricohams-logo.png" alt="BricoHams" class="webrx-top-logo bh-marca-logo" style="height:52px;width:auto;max-width:190px;object-fit:contain;padding:0;border-radius:6px;vertical-align:middle"><svg viewBox="0 0 591 100" style="display:none">';
}
location = /tar1090 { return 301 /tar1090/; }
# v5.0 · ADS-B local: tar1090 lo sirve nginx con la configuración oficial (alias a
# /run/readsb y /run/tar1090, sin lighttpd). install.sh genera el snippet; si tar1090
# no trae nginx-tar1090.conf, el snippet es el proxy antiguo a lighttpd (127.0.0.1:8504).
include /etc/nginx/snippets/bricohams-tar1090.conf;
location /camara/ {
    proxy_pass http://127.0.0.1:8888/;
    proxy_set_header Host $host;
    proxy_buffering off;
}
location = /bricohams { return 301 /bricohams/; }
location = /bricohams/api/oyentes {
    limit_req zone=bh_oyentes burst=3 nodelay;
    limit_req_status 429;
    limit_except POST { deny all; }
    proxy_pass http://127.0.0.1:8075;
    proxy_set_header Host $host;
}
location /bricohams/api/ {
    proxy_pass http://127.0.0.1:8075;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    limit_except GET { deny all; }
}
location /bricohams/ {
    alias /var/www/bricohams/;
    index index.html;
}
