name: Firmware

# Batch-builds LoRa APRS iGate (CA2RXU) and Meshtastic for every board with firmware-compilado/build_all.py.
# Binaries are never committed (see .gitignore and docs/manuales/38_GITHUB_SINCRONIZACION_PRIVACIDAD.md):
# they are uploaded as workflow artifacts and, on a "fw-*" tag, published as a GitHub Release.
# Building on the runner keeps personal paths (C:\Users\...) out of the binaries.

on:
  workflow_dispatch:
    inputs:
      kind:
        description: 'Which firmware to build'
        type: choice
        options: [all, igate, meshtastic]
        default: all
  push:
    tags:
      - 'fw-*'

permissions:
  contents: read

env:
  IGATE_REPO: richonguzman/LoRa_APRS_iGate
  IGATE_REV: 9314bf10ba0002c2d54ec186bab84eb810f7d404   # 2026-10-07, see docs/REFERENCIAS.md
  MESH_REPO: meshtastic/firmware
  MESH_REV: v2.7.26.54e0d8d
  PLATFORMIO_VERSION: '6.1.18'
  # The brand filter in build_all.py finds 90 Meshtastic boards; the kit ships these 35.
  MESH_ONLY: heltec-mesh-node-t096,heltec-mesh-node-t1,heltec-mesh-node-t114,heltec-mesh-pocket-10000,heltec-mesh-pocket-10000-inkhud,heltec-mesh-pocket-5000,heltec-mesh-pocket-5000-inkhud,heltec-mesh-solar,heltec-mesh-solar-eink,heltec-mesh-solar-inkhud,heltec-mesh-solar-oled,heltec-mesh-solar-tft,heltec-v1,heltec-v2_0,heltec-v2_1,seeed_solar_node,seeed_wio_tracker_L1,seeed_wio_tracker_L1_eink,seeed_wio_tracker_L1_eink-inkhud,seeed_xiao_nrf52840_btb,seeed_xiao_nrf52840_kit,seeed_xiao_nrf52840_kit_i2c,t-echo,t-echo-inkhud,t-echo-lite,t-echo-plus,t-impulse-plus,tbeam,tbeam0_7,tlora-v1,tlora-v2,tlora_v1_3,xiao_ble,xiao_ble_30db,xiao_ble_33db

jobs:
  envs:
    name: List build environments
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Fetch sources
        run: |
          git clone --filter=blob:none "https://github.com/$IGATE_REPO.git" src-igate
          git -C src-igate checkout -q "$IGATE_REV"
          git clone --filter=blob:none --depth 1 --branch "$MESH_REV" "https://github.com/$MESH_REPO.git" src-meshtastic
      - name: Build matrix
        id: list
        env:
          KIND: ${{ inputs.kind || 'all' }}
        run: |
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os, subprocess
          kinds = ['igate', 'meshtastic'] if os.environ['KIND'] == 'all' else [os.environ['KIND']]
          rows = []
          for kind in kinds:
              only = ['--only', os.environ['MESH_ONLY']] if kind == 'meshtastic' else []
              out = subprocess.run(['python', 'firmware-compilado/build_all.py', kind, '--src', f'src-{kind}',
                                    '--out', f'out-{kind}', '--list', *only], capture_output=True, text=True, check=True).stdout
              rows += [{'kind': kind, 'env': line.split('\t')[0]} for line in out.splitlines() if line.strip()]
          assert rows, 'no build environments found'
          print('matrix=' + json.dumps({'include': rows}))
          EOF

  build:
    name: ${{ matrix.kind }} ${{ matrix.env }}
    needs: envs
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.envs.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ matrix.kind }}-${{ env.PLATFORMIO_VERSION }}-${{ matrix.env }}
          restore-keys: pio-${{ matrix.kind }}-${{ env.PLATFORMIO_VERSION }}-
      - name: Fetch source
        env:
          KIND: ${{ matrix.kind }}
        run: |
          if [ "$KIND" = igate ]; then
            git clone --filter=blob:none "https://github.com/$IGATE_REPO.git" src
            git -C src checkout -q "$IGATE_REV"
          else
            git clone --depth 1 --branch "$MESH_REV" --recurse-submodules --shallow-submodules "https://github.com/$MESH_REPO.git" src
          fi
      - name: Install PlatformIO
        run: python -m pip install --disable-pip-version-check "platformio==$PLATFORMIO_VERSION"
      - name: Build
        env:
          KIND: ${{ matrix.kind }}
          ENV_NAME: ${{ matrix.env }}
          # Belt and braces: strip the build paths from __FILE__ and debug info.
          PLATFORMIO_BUILD_FLAGS: -ffile-prefix-map=${{ github.workspace }}=. -ffile-prefix-map=/home/runner=~
        run: python firmware-compilado/build_all.py "$KIND" --src src --out "out/$KIND" --jobs 1 --only "$ENV_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: fw-${{ matrix.kind }}-${{ matrix.env }}
          path: out/${{ matrix.kind }}/${{ matrix.env }}/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Check and publish
    needs: build
    if: always() && needs.build.result != 'cancelled'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: fw-*
      - name: Privacy check (no personal paths in any binary)
        run: |
          if grep -rlaiE 'C:[\\/]+Users[\\/]' dist; then
            echo "::error::A binary contains a Windows user path"; exit 1
          fi
      - name: Checksums
        run: |
          cd dist
          find . -type f \( -name '*.bin' -o -name '*.uf2' -o -name '*.zip' -o -name '*.hex' \) -print0 \
            | sort -z | xargs -0 sha256sum > SHA256SUMS
          wc -l SHA256SUMS
      - name: Bundle
        run: |
          for d in dist/fw-*/; do n=$(basename "$d"); (cd "$d" && zip -qr "../$n.zip" .); done
      - name: Release
        if: startsWith(github.ref, 'refs/tags/fw-') && needs.build.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Firmware $TAG" \
            --notes "iGate CA2RXU $IGATE_REV · Meshtastic $MESH_REV · PlatformIO $PLATFORMIO_VERSION" \
            dist/*.zip dist/SHA256SUMS
